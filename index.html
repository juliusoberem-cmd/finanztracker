                                                            className={`p-4 rounded-lg border cursor-pointer transition-all ${

                                                                    ? 'border-purple-300 bg-purple-50'

                                                        >

                                                                            {contract.interval === 'monthly' ? 'Monatlich' :
                                                                             contract.interval === 'yearly' ? 'Jährlich' :
                                                                             contract.interval === 'quarterly' ? 'Quartalsweise' : contract.interval}
                                                                        </span>

                                                                if (newSet.has(idx)) {
                                                                    newSet.delete(idx);
                                                                } else {
                                                                    newSet.add(idx);
                                                                }
                                                                setSelectedIncomeSources(newSet);
                                                            }}
                                                            className={`p-4 rounded-lg cursor-pointer transition-all border-2 ${
                                                                selectedIncomeSources.has(idx)
                                                                    ? 'border-green-500 bg-green-50'
                                                                    : 'border-gray-200 hover:border-gray-300'
                                                            }`}
                                                        >
                                                            <div className="flex items-center gap-4">
                                                                <input
                                                                    type="checkbox"
                                                                    checked={selectedIncomeSources.has(idx)}
                                                                    onChange={() => {}}
                                                                    className="w-5 h-5 text-green-600 rounded"
                                                                />
                                                                <div className="flex-1 min-w-0">
                                                                    <div className="flex items-center gap-2 flex-wrap">
                                                                        <span className="text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700">
                                                                            {income.type === 'salary' ? 'Gehalt' :
                                                                             income.type === 'pension' ? 'Rente' :
                                                                             income.type === 'benefits' ? 'Sozialleistung' :
                                                                             income.type === 'rental' ? 'Mieteinnahme' :
                                                                             income.type === 'investment' ? 'Kapitalertrag' : 'Einkommen'}
                                                                        </span>
                                                                        <span className="text-xs text-gray-500">{income.date}</span>
                                                                    </div>
                                                                    <div className="font-medium text-gray-900 mt-1">{income.name}</div>
                                                                    <div className="text-xs text-gray-500 mt-1 truncate">
                                                                        {income.originalDescription}
                                                                    </div>
                                                                </div>
                                                                <div className="text-right">
                                                                    <div className="font-semibold text-green-600">{formatEuro(income.amount)}</div>
                                                                    <div className="text-xs text-gray-500">/Monat</div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </Card>

                                            {/* Income Import Button */}
                                            <Card>
                                                <div className="flex items-center justify-between">
                                                    <div>
                                                        <div className="font-medium text-gray-900">Als Einkommen speichern:</div>
                                                        <div className="text-sm text-gray-600 mt-1">
                                                            {selectedIncomeSources.size} Einkommensquelle(n) ausgewählt
                                                        </div>
                                                    </div>
                                                    <button
                                                        onClick={() => {
                                                            if (selectedIncomeSources.size === 0) return;
                                                            const incomesToAdd = Array.from(selectedIncomeSources).map(idx => {
                                                                const inc = parseResult.incomeSources[idx];
                                                                return {
                                                                    name: inc.name,
                                                                    amount: inc.amount,
                                                                    interval: 'monthly'
                                                                };
                                                            });
                                                            // Also add to transactions list
                                                            const transactionsToAdd = Array.from(selectedIncomeSources).map(idx => {
                                                                const inc = parseResult.incomeSources[idx];
                                                                return {
                                                                    description: inc.originalDescription,
                                                                    name: inc.name,
                                                                    amount: Math.abs(inc.amount),
                                                                    category: inc.type === 'salary' ? 'Gehalt' : 'Einkommen',
                                                                    date: inc.date,
                                                                    isIncome: true
                                                                };
                                                            });
                                                            addIncomes(incomesToAdd);
                                                            if (addTransactions) addTransactions(transactionsToAdd);
                                                            setSelectedIncomeSources(new Set());
                                                            // Remove imported income sources from list
                                                            const importedIndices = Array.from(selectedIncomeSources);
                                                            const remainingIncomes = parseResult.incomeSources.filter((_, i) => !importedIndices.includes(i));
                                                            setParseResult({ ...parseResult, incomeSources: remainingIncomes });
                                                        }}
                                                        disabled={selectedIncomeSources.size === 0}
                                                        className={`px-6 py-2 rounded-lg font-medium transition-colors flex items-center gap-2 ${
                                                            selectedIncomeSources.size > 0
                                                                ? 'bg-green-600 text-white hover:bg-green-700'
                                                                : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                                        }`}
                                                    >
                                                        <Download /> Als Einkommen speichern
                                                    </button>
                                                </div>
                                            </Card>
                                        </>
                                    ) : (
                                        <Card>
                                            <div className="text-center py-8 text-gray-500">
                                                <TrendingUp className="mx-auto mb-3 text-gray-300" />
                                                <div>Kein Einkommen erkannt</div>
                                                <div className="text-sm text-gray-400 mt-1">
                                                    Es wurden keine Gehaltseingänge oder andere Einkommensquellen in diesem Kontoauszug gefunden.
                                                </div>
                                            </div>
                                        </Card>
                                    )}
                                </>
                            )}

                            {/* SAVINGS PLANS TAB */}
                            {activeTab === 'savings' && (
                                <>
                                    <Card>
                                        <div className="flex items-start gap-3">
                                            <div className="text-emerald-600"><Piggybank /></div>
                                            <div>
                                                <h3 className="font-medium text-gray-900">Sparpläne erkannt</h3>
                                                <p className="text-sm text-gray-600 mt-1">
                                                    Folgende Sparpläne wurden im Kontoauszug erkannt (ETF-Sparpläne, Wertpapiersparpläne, etc.).
                                                    Wähle aus, welche du als Sparrate speichern möchtest.
                                                </p>
                                            </div>
                                        </div>
                                    </Card>

                                    {parseResult.savingsPlans?.length > 0 ? (
                                        <>
                                            {/* Selection Controls */}
                                            <Card>
                                                <div className="flex items-center gap-4">
                                                    <button
                                                        onClick={() => {
                                                            if (selectedSavingsPlans.size === parseResult.savingsPlans.length) {
                                                                setSelectedSavingsPlans(new Set());
                                                            } else {
                                                                setSelectedSavingsPlans(new Set(parseResult.savingsPlans.map((_, i) => i)));
                                                            }
                                                        }}
                                                        className="text-sm text-emerald-600 hover:text-emerald-700"
                                                    >
                                                        {selectedSavingsPlans.size === parseResult.savingsPlans.length ? 'Alle abwählen' : 'Alle auswählen'}
                                                    </button>
                                                    <span className="text-sm text-gray-500">
                                                        {selectedSavingsPlans.size} von {parseResult.savingsPlans.length} ausgewählt
                                                    </span>
                                                </div>
                                            </Card>

                                            {/* Savings Plans List */}
                                            <Card>
                                                <div className="space-y-2 max-h-96 overflow-y-auto">
                                                    {parseResult.savingsPlans.map((plan, idx) => (
                                                        <div
                                                            key={idx}
                                                            onClick={() => {
                                                                const newSet = new Set(selectedSavingsPlans);
                                                                if (newSet.has(idx)) {
                                                                    newSet.delete(idx);
                                                                } else {
                                                                    newSet.add(idx);
                                                                }
                                                                setSelectedSavingsPlans(newSet);
                                                            }}
                                                            className={`p-4 rounded-lg cursor-pointer transition-all border-2 ${
                                                                selectedSavingsPlans.has(idx)
                                                                    ? 'border-emerald-500 bg-emerald-50'
                                                                    : 'border-gray-200 hover:border-gray-300'
                                                            }`}
                                                        >
                                                            <div className="flex items-center gap-4">
                                                                <input
                                                                    type="checkbox"
                                                                    checked={selectedSavingsPlans.has(idx)}
                                                                    onChange={() => {}}
                                                                    className="w-5 h-5 text-emerald-600 rounded"
                                                                />
                                                                <div className="flex-1 min-w-0">
                                                                    <div className="flex items-center gap-2 flex-wrap">
                                                                        <span className="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">
                                                                            Sparplan
                                                                        </span>
                                                                        <span className="text-xs text-gray-500">{plan.date}</span>
                                                                        {plan.uncertain && (
                                                                            <span className="text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">
                                                                                Unsicher
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                    <div className="font-medium text-gray-900 mt-1">{plan.name}</div>
                                                                    <div className="text-xs text-gray-500 mt-1 truncate">
                                                                        {plan.originalDescription}
                                                                    </div>
                                                                </div>
                                                                <div className="text-right">
                                                                    <div className="font-semibold text-emerald-600">{formatEuro(plan.amount)}</div>
                                                                    <div className="text-xs text-gray-500">/Monat</div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </Card>

                                            {/* Savings Plan Import Button */}
                                            <Card>
                                                <div className="flex items-center justify-between">
                                                    <div>
                                                        <div className="font-medium text-gray-900">Als Sparrate speichern:</div>
                                                        <div className="text-sm text-gray-600 mt-1">
                                                            {selectedSavingsPlans.size} Sparplan/-pläne ausgewählt
                                                        </div>
                                                    </div>
                                                    <button
                                                        onClick={() => {
                                                            if (selectedSavingsPlans.size === 0) return;
                                                            const savingsToAdd = Array.from(selectedSavingsPlans).map(idx => {
                                                                const plan = parseResult.savingsPlans[idx];
                                                                return {
                                                                    name: plan.name,
                                                                    amount: plan.amount,
                                                                    type: 'recurring',
                                                                    interval: plan.interval || 'monthly'
                                                                };
                                                            });
                                                            // Also add to transactions list
                                                            const transactionsToAdd = Array.from(selectedSavingsPlans).map(idx => {
                                                                const plan = parseResult.savingsPlans[idx];
                                                                return {
                                                                    description: plan.originalDescription,
                                                                    name: plan.name,
                                                                    amount: -Math.abs(plan.amount),
                                                                    category: 'Sparen',
                                                                    date: plan.date,
                                                                    isSavingsPlan: true
                                                                };
                                                            });
                                                            addSavings(savingsToAdd);
                                                            if (addTransactions) addTransactions(transactionsToAdd);
                                                            setSelectedSavingsPlans(new Set());
                                                            // Remove imported savings plans from list
                                                            const importedIndices = Array.from(selectedSavingsPlans);
                                                            const remainingPlans = parseResult.savingsPlans.filter((_, i) => !importedIndices.includes(i));
                                                            setParseResult({ ...parseResult, savingsPlans: remainingPlans });
                                                        }}
                                                        disabled={selectedSavingsPlans.size === 0}
                                                        className={`px-6 py-2 rounded-lg font-medium transition-colors flex items-center gap-2 ${
                                                            selectedSavingsPlans.size > 0
                                                                ? 'bg-emerald-600 text-white hover:bg-emerald-700'
                                                                : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                                        }`}
                                                    >
                                                        <Download /> Als Sparrate speichern
                                                    </button>
                                                </div>
                                            </Card>
                                        </>
                                    ) : (
                                        <Card>
                                            <div className="text-center py-8 text-gray-500">
                                                <Piggybank className="mx-auto mb-3 text-gray-300" />
                                                <div>Keine Sparpläne erkannt</div>
                                                <div className="text-sm text-gray-400 mt-1">
                                                    Es wurden keine Sparpläne oder ETF-Investitionen in diesem Kontoauszug gefunden.
                                                </div>
                                            </div>
                                        </Card>
                                    )}
                                </>
                            )}

                            {/* Import Summary & Button - Only show in expenses tab */}
                            {activeTab === 'expenses' && (
                                <Card>
                                    <div className="space-y-4">
                                        <div>
                                            <div className="font-medium text-gray-900">Ausgewählt zum Import:</div>
                                            <div className="text-sm text-gray-600 mt-1">
                                                <span className="text-red-600 font-medium">{selectedExpenses.length} Ausgaben</span>
                                                {' '}({formatEuro(selectedExpenses.reduce((s, i) => s + parseResult.transactions[i].amount, 0))})
                                            </div>
                                            <div className="text-xs text-gray-500 mt-2">
                                                Ausgaben werden zur Analyse hinzugefügt. Verträge kannst du im Tab "Verträge / Fixkosten" als Fixkosten importieren.
                                            </div>
                                        </div>
                                        <div className="flex justify-end gap-2">
                                            <button
                                                onClick={() => { setParseResult(null); setSelectedTransactions(new Set()); setCategoryMapping({}); setSelectedContracts(new Set()); }}
                                                className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
                                            >
                                                Abbrechen
                                            </button>
                                            <button
                                                onClick={handleImport}
                                                disabled={selectedExpenses.length === 0 || importing}
                                                className={`px-6 py-2 rounded-lg font-medium transition-colors flex items-center gap-2 ${
                                                    selectedExpenses.length > 0 && !importing
                                                        ? 'bg-blue-600 text-white hover:bg-blue-700'
                                                        : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                                }`}
                                            >
                                                {importing ? (
                                                    <>Importiere...</>
                                                ) : (
                                                    <><Download /> {selectedExpenses.length} Ausgaben importieren</>
                                                )}
                                            </button>
                                        </div>
                                    </div>
                                </Card>
                            )}
                        </>
                    )}

                    {/* Help Section */}
                    <Card>
                        <CardTitle>So exportierst du bei C24:</CardTitle>
                        <ol className="mt-3 text-sm text-gray-600 space-y-2 list-decimal list-inside">
                            <li>Öffne die C24 Bank App oder das Online-Banking</li>
                            <li>Gehe zu deinem Girokonto → Kontoauszüge</li>
                            <li>Wähle den gewünschten Kontoauszug (Monat)</li>
                            <li>Lade den Kontoauszug als PDF herunter</li>
                            <li>Lade die PDF-Datei hier hoch</li>
                        </ol>
                        <div className="mt-4 p-3 bg-blue-50 rounded-lg">
                            <div className="text-sm text-blue-800">
                                <strong>Tipp:</strong> Die App erkennt automatisch Einnahmen und Ausgaben aus dem PDF
                                und kategorisiert bekannte Händler wie REWE, Amazon, etc.
                            </div>
                        </div>
                    </Card>
                </div>
            );
        }

        ReactDOM.render(<FinanceTracker />, document.getElementById('root'));
    </script>
</body>
</html>
