<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanz Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }
        .fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 22px;
            background: #111827;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        }
        .fab:hover {
            background: #1f2937;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .fab:active { transform: translateY(0); }

        /* Mobile Bottom Navigation */
        @media (max-width: 640px) {
            .fab {
                bottom: 80px;
                right: 16px;
                padding: 12px 18px;
                font-size: 13px;
            }
            .bottom-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: white;
                border-top: 1px solid #e5e7eb;
                display: flex;
                justify-content: space-around;
                padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
                z-index: 50;
            }
            .bottom-nav-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
                padding: 4px 8px;
                border: none;
                background: none;
                color: #6b7280;
                font-size: 10px;
                cursor: pointer;
                transition: color 0.2s;
            }
            .bottom-nav-item.active {
                color: #2563eb;
            }
            .desktop-nav {
                display: none !important;
            }
            .mobile-header {
                display: flex !important;
            }
        }
        @media (min-width: 641px) {
            .bottom-nav {
                display: none;
            }
            .mobile-header {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ─── Icons ───────────────────────────────────────────────────────────
        const PlusCircle = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>);
        const TrendingDown = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>);
        const TrendingUp = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>);
        const Receipt = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17V7"/></svg>);
        const Trash2 = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>);
        const Check = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>);
        const X = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>);
        const Wallet = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>);
        const AlertCircle = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>);
        const Pencil = () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>);
        const PieChart = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>);
        const Target = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>);
        const Piggybank = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/><path d="M2 9v1c0 1.1.9 2 2 2h1"/><path d="M16 11h.01"/></svg>);
        const BarChart2 = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>);
        const DollarSign = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>);
        const FileText = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>);
        const ShoppingCart = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>);

        // ─── Helpers ─────────────────────────────────────────────────────────
        const LABELS = { weekly: 'Woche', monthly: 'Monat', yearly: 'Jahr' };
        const INTERVAL_LABELS = { weekly: 'Wöchentlich', monthly: 'Monatlich', quarterly: 'Quartalsweise', yearly: 'Jährlich' };

        function convertToTimeframe(amount, fromInterval, toTimeframe) {
            const a = parseFloat(amount);
            if (toTimeframe === 'weekly') {
                if (fromInterval === 'weekly') return a;
                if (fromInterval === 'monthly') return a / 4.33;
                if (fromInterval === 'quarterly') return a / 13;
                if (fromInterval === 'yearly') return a / 52;
            } else if (toTimeframe === 'monthly') {
                if (fromInterval === 'monthly') return a;
                if (fromInterval === 'quarterly') return a / 3;
                if (fromInterval === 'yearly') return a / 12;
                if (fromInterval === 'weekly') return a * 4.33;
            } else if (toTimeframe === 'yearly') {
                if (fromInterval === 'yearly') return a;
                if (fromInterval === 'quarterly') return a * 4;
                if (fromInterval === 'monthly') return a * 12;
                if (fromInterval === 'weekly') return a * 52;
            }
            return a;
        }

        function sumForTimeframe(items, timeframe) {
            return items.reduce((sum, item) => sum + convertToTimeframe(item.amount, item.interval, timeframe), 0);
        }

        function getExpensesInTimeframe(expenses, timeframe) {
            const now = new Date();
            return expenses.filter(e => {
                const diff = (now - new Date(e.date)) / (1000 * 60 * 60 * 24);
                if (timeframe === 'weekly') return diff <= 7;
                if (timeframe === 'monthly') return diff <= 30;
                if (timeframe === 'yearly') return diff <= 365;
                return true;
            });
        }

        function formatEuro(amount) {
            return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(amount);
        }

        function formatDate(d) {
            return new Date(d).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        // ─── Build chart buckets depending on timeframe ─────────────────────
        function buildChartData(expenses, timeframe) {
            const now = new Date();
            const buckets = [];

            if (timeframe === 'weekly') {
                // 7 buckets: one per day, labeled Mo Di Mi ...
                const dayNames = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(now);
                    d.setDate(d.getDate() - i);
                    buckets.push({ label: dayNames[d.getDay()], total: 0 });
                }
                expenses.forEach(e => {
                    const diff = Math.floor((now - new Date(e.date)) / (1000 * 60 * 60 * 24));
                    if (diff >= 0 && diff <= 6) {
                        buckets[6 - diff].total += parseFloat(e.amount);
                    }
                });
            } else if (timeframe === 'monthly') {
                // 4 buckets: KW 1–4 (je 7 Tage)
                for (let i = 0; i < 4; i++) {
                    buckets.push({ label: 'KW ' + (i + 1), total: 0 });
                }
                expenses.forEach(e => {
                    const diff = (now - new Date(e.date)) / (1000 * 60 * 60 * 24);
                    if (diff >= 0 && diff <= 30) {
                        const week = Math.min(Math.floor(diff / 7), 3);
                        buckets[3 - week].total += parseFloat(e.amount);
                    }
                });
            } else if (timeframe === 'yearly') {
                // 12 buckets: Jan–Dez
                const monthNames = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
                for (let i = 0; i < 12; i++) {
                    buckets.push({ label: monthNames[i], total: 0 });
                }
                expenses.forEach(e => {
                    const d = new Date(e.date);
                    const diff = (now - d) / (1000 * 60 * 60 * 24);
                    if (diff >= 0 && diff <= 365) {
                        buckets[d.getMonth()].total += parseFloat(e.amount);
                    }
                });
            }
            return buckets;
        }

        // ─── Pure-SVG Bar Chart ──────────────────────────────────────────────
        function ExpenseChart({ expenses, timeframe }) {
            const containerRef = useRef(null);
            const [width, setWidth] = useState(600);

            useEffect(() => {
                const measure = () => {
                    if (containerRef.current) setWidth(containerRef.current.clientWidth);
                };
                measure();
                window.addEventListener('resize', measure);
                return () => window.removeEventListener('resize', measure);
            }, []);

            const data = buildChartData(getExpensesInTimeframe(expenses, timeframe), timeframe);
            const maxVal = Math.max(...data.map(d => d.total), 1);

            const padL = 60, padR = 16, padT = 12, padB = 36;
            const chartW = width - padL - padR;
            const chartH = 160;
            const barW = Math.max((chartW / data.length) * 0.55, 8);
            const gap = chartW / data.length;

            // Y-Achse: 3 Stufen
            const ySteps = [0, maxVal / 2, maxVal];

            return (
                <div ref={containerRef} className="w-full">
                    <svg width={width} height={chartH + padT + padB} style={{ display: 'block' }}>
                        {/* Horizontale Gridlines + Labels */}
                        {ySteps.map((val, i) => {
                            const y = padT + chartH - (val / maxVal) * chartH;
                            return (
                                <g key={i}>
                                    <line x1={padL} y1={y} x2={width - padR} y2={y} stroke="#f0f0f0" strokeWidth="1" />
                                    <text x={padL - 8} y={y + 4} textAnchor="end" fontSize="10" fill="#9ca3af" fontFamily="inherit">
                                        {val === 0 ? '0 €' : (val >= 1000 ? (val/1000).toFixed(1) + 'k' : Math.round(val)) + ' €'}
                                    </text>
                                </g>
                            );
                        })}

                        {/* Balken + X-Labels */}
                        {data.map((d, i) => {
                            const barH = (d.total / maxVal) * chartH;
                            const x = padL + i * gap + (gap - barW) / 2;
                            const y = padT + chartH - barH;
                            return (
                                <g key={i}>
                                    <rect x={x} y={y} width={barW} height={barH} rx="4" fill={d.total > 0 ? '#3b82f6' : '#e5e7eb'} />
                                    {/* Wert-Label oben */}
                                    {d.total > 0 && (
                                        <text x={x + barW / 2} y={y - 5} textAnchor="middle" fontSize="9" fill="#6b7280" fontFamily="inherit">
                                            {d.total >= 1000 ? (d.total/1000).toFixed(1) + 'k' : Math.round(d.total)}€
                                        </text>
                                    )}
                                    {/* X-Achse Label */}
                                    <text x={x + barW / 2} y={padT + chartH + 20} textAnchor="middle" fontSize="10" fill="#9ca3af" fontFamily="inherit">
                                        {d.label}
                                    </text>
                                </g>
                            );
                        })}
                    </svg>
                </div>
            );
        }

        // ─── localStorage bridge ─────────────────────────────────────────────
        const storage = {
            get: async (key) => { const v = localStorage.getItem(key); if (!v) throw new Error(); return { value: v }; },
            set: async (key, value) => { localStorage.setItem(key, value); }
        };

        // ─── Shared sub-components ───────────────────────────────────────────
        function TimeframeFilter({ timeframe, setTimeframe }) {
            return (
                <div className="flex gap-2">
                    {['weekly', 'monthly', 'yearly'].map(tf => (
                        <button key={tf} onClick={() => setTimeframe(tf)}
                            className={`px-3 py-1.5 rounded-lg text-sm transition-colors ${timeframe === tf ? 'bg-gray-900 text-white' : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'}`}>
                            {LABELS[tf]}
                        </button>
                    ))}
                </div>
            );
        }

        function Card({ children }) {
            return <div className="bg-white rounded-xl p-6 border border-gray-100 shadow-sm">{children}</div>;
        }

        function CardTitle({ icon, children }) {
            return (
                <div className="flex items-center gap-2 text-gray-900 font-medium">
                    {icon && <span className="text-gray-400">{icon}</span>}
                    {children}
                </div>
            );
        }

        function Input({ label, ...props }) {
            return (
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">{label}</label>
                    <input {...props} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
                </div>
            );
        }

        function IntervalSelect({ value, onChange }) {
            return (
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">Intervall</label>
                    <select value={value} onChange={onChange} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="weekly">Wöchentlich</option>
                        <option value="monthly">Monatlich</option>
                        <option value="quarterly">Quartalsweise</option>
                        <option value="yearly">Jährlich</option>
                    </select>
                </div>
            );
        }

        // ─── ROOT ────────────────────────────────────────────────────────────
        function FinanceTracker() {
            const [view, setView] = useState('analysis');
            const [fixedCosts, setFixedCosts] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [income, setIncome] = useState([]);
            const [savings, setSavings] = useState([]);
            const [categories, setCategories] = useState(['Lebensmittel', 'Transport', 'Unterhaltung']);
            const [timeframe, setTimeframe] = useState('monthly');
            const [loading, setLoading] = useState(true);
            const [triggerAdd, setTriggerAdd] = useState(0);

            useEffect(() => { loadData(); }, []);

            // Keyboard shortcut: Cmd+N / Ctrl+N zum Hinzufügen
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
                        e.preventDefault();
                        // Wechsle zur passenden Seite falls auf Analyse
                        if (view === 'analysis') {
                            setView('expenses');
                        }
                        setTriggerAdd(prev => prev + 1);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [view]);

            const loadData = async () => {
                try {
                    const [f, e, c, i, s] = await Promise.all([
                        storage.get('fixed-costs').catch(() => null),
                        storage.get('expenses').catch(() => null),
                        storage.get('categories').catch(() => null),
                        storage.get('income').catch(() => null),
                        storage.get('savings').catch(() => null)
                    ]);
                    if (f?.value) setFixedCosts(JSON.parse(f.value));
                    if (e?.value) setExpenses(JSON.parse(e.value));
                    if (c?.value) setCategories(JSON.parse(c.value));
                    if (i?.value) setIncome(JSON.parse(i.value));
                    if (s?.value) setSavings(JSON.parse(s.value));
                } catch (err) { console.error(err); }
                finally { setLoading(false); }
            };

            const save = async (key, data) => { try { await storage.set(key, JSON.stringify(data)); } catch(e) {} };

            const crud = (key, list, setList) => ({
                add: (item) => { const u = [...list, { ...item, id: Date.now() }]; setList(u); save(key, u); },
                update: (id, item) => { const u = list.map(i => i.id === id ? { ...item, id } : i); setList(u); save(key, u); },
                remove: (id) => { const u = list.filter(i => i.id !== id); setList(u); save(key, u); }
            });

            const incomeCrud = crud('income', income, setIncome);
            const fixedCrud = crud('fixed-costs', fixedCosts, setFixedCosts);
            const expenseCrud = crud('expenses', expenses, setExpenses);
            const savingsCrud = crud('savings', savings, setSavings);

            const addCategory = (cat) => { const u = [...categories, cat]; setCategories(u); save('categories', u); };

            if (loading) return <div className="min-h-screen bg-gray-50 flex items-center justify-center"><div className="text-gray-400">Laden...</div></div>;

            const navItems = [
                { key: 'analysis', label: 'Analyse', icon: <BarChart2 /> },
                { key: 'income', label: 'Einkommen', icon: <DollarSign /> },
                { key: 'fixed', label: 'Fixkosten', icon: <FileText /> },
                { key: 'expenses', label: 'Ausgaben', icon: <ShoppingCart /> },
                { key: 'savings', label: 'Sparen', icon: <Piggybank /> }
            ];

            return (
                <div className="min-h-screen bg-gray-50 pb-16 sm:pb-0">
                    {/* Desktop Navigation */}
                    <nav className="bg-white border-b border-gray-200 desktop-nav">
                        <div className="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
                            <h1 className="text-xl font-medium text-gray-900">Finanzen</h1>
                            <div className="flex gap-1 flex-wrap">
                                {navItems.map(({ key, label }) => (
                                    <button key={key} onClick={() => setView(key)}
                                        className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${view === key ? 'bg-blue-50 text-blue-600' : 'text-gray-600 hover:bg-gray-50'}`}>{label}</button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    {/* Mobile Header */}
                    <header className="bg-white border-b border-gray-200 mobile-header px-4 py-3">
                        <h1 className="text-lg font-semibold text-gray-900 text-center">
                            {navItems.find(n => n.key === view)?.label || 'Finanzen'}
                        </h1>
                    </header>

                    {/* Mobile Bottom Navigation */}
                    <nav className="bottom-nav">
                        {navItems.map(({ key, label, icon }) => (
                            <button key={key} onClick={() => setView(key)}
                                className={`bottom-nav-item ${view === key ? 'active' : ''}`}>
                                {icon}
                                <span>{label}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="max-w-5xl mx-auto px-4 sm:px-6 py-4 sm:py-8">
                        {view === 'analysis'   && <Analysis   fixedCosts={fixedCosts} expenses={expenses} income={income} savings={savings} timeframe={timeframe} setTimeframe={setTimeframe} />}
                        {view === 'income'     && <Income     income={income}     {...incomeCrud} triggerAdd={triggerAdd} />}
                        {view === 'fixed'      && <FixedCosts costs={fixedCosts}  {...fixedCrud} triggerAdd={triggerAdd} />}
                        {view === 'expenses'   && <Expenses   expenses={expenses} categories={categories} {...expenseCrud} onAddCategory={addCategory} timeframe={timeframe} setTimeframe={setTimeframe} triggerAdd={triggerAdd} />}
                        {view === 'savings'    && <Savings    savings={savings}   {...savingsCrud} income={income} fixedCosts={fixedCosts} expenses={expenses} triggerAdd={triggerAdd} />}
                    </main>
                </div>
            );
        }

        // ─── ANALYSIS ─────────────────────────────────────────────────────────
        function Analysis({ fixedCosts, expenses, income, savings, timeframe, setTimeframe }) {
            const tfIncome = sumForTimeframe(income, timeframe);
            const tfFixed = sumForTimeframe(fixedCosts, timeframe);
            const tfSavings = sumForTimeframe(savings, timeframe);
            const tfExpenses = getExpensesInTimeframe(expenses, timeframe).reduce((s, e) => s + parseFloat(e.amount), 0);
            const available = tfIncome - tfFixed - tfSavings;
            const remaining = available - tfExpenses;

            // Prozentuale Aufteilung
            const fixedPct = tfIncome > 0 ? (tfFixed / tfIncome) * 100 : 0;
            const savingsPct = tfIncome > 0 ? (tfSavings / tfIncome) * 100 : 0;
            const expensesPct = tfIncome > 0 ? (tfExpenses / tfIncome) * 100 : 0;
            const remainingPct = tfIncome > 0 ? (remaining / tfIncome) * 100 : 0;

            // Ausgaben nach Kategorie
            const byCategory = {};
            getExpensesInTimeframe(expenses, timeframe).forEach(e => {
                byCategory[e.category] = (byCategory[e.category] || 0) + parseFloat(e.amount);
            });

            // Top Fixkosten
            const topFixed = [...fixedCosts].sort((a, b) => convertToTimeframe(b.amount, b.interval, timeframe) - convertToTimeframe(a.amount, a.interval, timeframe)).slice(0, 5);

            return (
                <div className="space-y-6">

                            <div className="text-2xl font-semibold text-green-600">{formatEuro(tfIncome)}</div>
                            <div className="text-xs text-gray-400 mt-1">pro {LABELS[timeframe]}</div>
                        </Card>
                        <Card>
                            <div className="flex items-center gap-2 text-gray-500 mb-2">
                                <Receipt />
                                <span className="text-xs font-medium">Fixkosten</span>
                            </div>
                            <div className="text-2xl font-semibold text-orange-600">{formatEuro(tfFixed)}</div>
                            <div className="text-xs text-gray-400 mt-1">{fixedPct.toFixed(0)}% vom Einkommen</div>
                        </Card>
                        <Card>
                            <div className="flex items-center gap-2 text-gray-500 mb-2">
                                <Piggybank />
                                <span className="text-xs font-medium">Sparen</span>
                            </div>
                            <div className="text-2xl font-semibold text-blue-600">{formatEuro(tfSavings)}</div>
                            <div className="text-xs text-gray-400 mt-1">{savingsPct.toFixed(0)}% vom Einkommen</div>
                        </Card>
                        <Card>
                            <div className="flex items-center gap-2 text-gray-500 mb-2">
                                <Wallet />
                                <span className="text-xs font-medium">Frei verfügbar</span>
                            </div>
                            <div className={`text-2xl font-semibold ${remaining >= 0 ? 'text-gray-900' : 'text-red-600'}`}>{formatEuro(remaining)}</div>
                            <div className="text-xs text-gray-400 mt-1">{remainingPct.toFixed(0)}% vom Einkommen</div>
                        </Card>
                    </div>

                    {/* Geldfluss-Visualisierung */}
                    <Card>
                        <CardTitle icon={<PieChart />}>Geldfluss - Wohin geht dein Geld?</CardTitle>
                        <div className="mt-6 space-y-4">
                            <div className="h-8 bg-gray-100 rounded-full overflow-hidden flex">
                                {tfIncome > 0 && (
                                    <>
                                        <div className="bg-orange-500 h-full transition-all" style={{ width: `${fixedPct}%` }} title={`Fixkosten: ${fixedPct.toFixed(1)}%`} />
                                        <div className="bg-blue-500 h-full transition-all" style={{ width: `${savingsPct}%` }} title={`Sparen: ${savingsPct.toFixed(1)}%`} />
                                        <div className="bg-red-400 h-full transition-all" style={{ width: `${expensesPct}%` }} title={`Ausgaben: ${expensesPct.toFixed(1)}%`} />
                                        {remainingPct > 0 && <div className="bg-green-500 h-full transition-all" style={{ width: `${remainingPct}%` }} title={`Übrig: ${remainingPct.toFixed(1)}%`} />}
                                    </>
                                )}
                            </div>
                            <div className="flex flex-wrap gap-4 text-sm">
                                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-orange-500" /><span>Fixkosten ({fixedPct.toFixed(0)}%)</span></div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-blue-500" /><span>Sparen ({savingsPct.toFixed(0)}%)</span></div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-red-400" /><span>Ausgaben ({expensesPct.toFixed(0)}%)</span></div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-green-500" /><span>Übrig ({remainingPct.toFixed(0)}%)</span></div>
                            </div>
                        </div>
                    </Card>

                    <div className="grid md:grid-cols-2 gap-6">
                        {/* Top Fixkosten */}
                        <Card>
                            <CardTitle icon={<Receipt />}>Top Fixkosten</CardTitle>
                            <div className="mt-4 space-y-3">
                                {topFixed.length === 0 ? (
                                    <div className="text-gray-400 text-sm">Keine Fixkosten erfasst</div>
                                ) : topFixed.map(cost => {
                                    const amount = convertToTimeframe(cost.amount, cost.interval, timeframe);
                                    const pct = tfFixed > 0 ? (amount / tfFixed) * 100 : 0;
                                    return (
                                        <div key={cost.id} className="flex items-center justify-between">
                                            <div>
                                                <div className="font-medium text-gray-900">{cost.name}</div>
                                                <div className="text-xs text-gray-500">{INTERVAL_LABELS[cost.interval]}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-semibold text-gray-900">{formatEuro(amount)}</div>
                                                <div className="text-xs text-gray-500">{pct.toFixed(0)}%</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </Card>

                        {/* Ausgaben nach Kategorie */}
                        <Card>
                            <CardTitle icon={<TrendingDown />}>Ausgaben nach Kategorie</CardTitle>
                            <div className="mt-4 space-y-3">
                                {Object.keys(byCategory).length === 0 ? (
                                    <div className="text-gray-400 text-sm">Keine Ausgaben in diesem Zeitraum</div>
                                ) : Object.entries(byCategory).sort(([,a],[,b]) => b - a).map(([cat, amt]) => {
                                    const pct = tfExpenses > 0 ? (amt / tfExpenses) * 100 : 0;
                                    return (
                                        <div key={cat}>
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="text-gray-700">{cat}</span>
                                                <div className="flex items-center gap-2">
                                                    <span className="text-xs text-gray-500">{pct.toFixed(0)}%</span>

                            </div>

                                <div className="text-xs text-gray-400 mt-1">Fix + Variable</div>
                            </div>
                        </div>

        // ─── Inline Editable Row für Einkommen/Fixkosten ─────────────────────
        function EditableIncomeRow({ item, update, remove, isNew, onCancel }) {
            const [data, setData] = useState({ name: item.name || '', amount: item.amount || '', interval: item.interval || 'monthly' });
            const inputRef = useRef(null);

            useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

            const save = () => {
                if (!data.name || !data.amount) return;
                update(item.id, data);
                if (isNew && onCancel) onCancel();
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); save(); }
                if (e.key === 'Escape' && isNew && onCancel) onCancel();
            };

            return (
                <div className="bg-white rounded-lg px-4 py-3 border border-blue-200 shadow-sm">
                    <div className="space-y-2 sm:space-y-0 sm:flex sm:items-center sm:gap-3">
                        <input ref={inputRef} type="text" value={data.name} onChange={e => setData({...data, name: e.target.value})} onKeyDown={handleKeyDown}
                            placeholder="Bezeichnung" className="w-full sm:flex-1 px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" />
                        <div className="flex gap-2 sm:gap-3">
                            <input type="number" step="0.01" value={data.amount} onChange={e => setData({...data, amount: e.target.value})} onKeyDown={handleKeyDown}
                                placeholder="Betrag" className="flex-1 sm:w-24 sm:flex-none px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm text-right" />
                            <select value={data.interval} onChange={e => setData({...data, interval: e.target.value})} onKeyDown={handleKeyDown}
                                className="flex-1 sm:flex-none px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
                                <option value="weekly">Wöchentlich</option>
                                <option value="monthly">Monatlich</option>
                                <option value="quarterly">Quartalsweise</option>
                                <option value="yearly">Jährlich</option>
                            </select>
                        </div>
                        <div className="flex justify-end gap-2 pt-2 sm:pt-0 border-t sm:border-0 border-gray-100">
                            <button onClick={save} className="flex-1 sm:flex-none bg-green-50 text-green-600 hover:bg-green-100 sm:bg-transparent sm:hover:bg-transparent transition-colors p-2 sm:p-1 rounded sm:rounded-none"><Check /></button>
                            {isNew ? (
                                <button onClick={onCancel} className="flex-1 sm:flex-none bg-gray-50 text-gray-400 hover:bg-gray-100 sm:bg-transparent sm:hover:bg-transparent hover:text-gray-600 transition-colors p-2 sm:p-1 rounded sm:rounded-none"><X /></button>
                            ) : (
                                <button onClick={() => remove(item.id)} className="flex-1 sm:flex-none bg-gray-50 text-gray-400 hover:bg-red-50 sm:bg-transparent sm:hover:bg-transparent hover:text-red-500 transition-colors p-2 sm:p-1 rounded sm:rounded-none"><Trash2 /></button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ─── INCOME ──────────────────────────────────────────────────────────
        function Income({ income, add, update, remove, triggerAdd }) {
            const [editingId, setEditingId] = useState(null);
            const [isAdding, setIsAdding] = useState(false);

            // Reagiere auf Cmd+N
            useEffect(() => {
                if (triggerAdd > 0) setIsAdding(true);
            }, [triggerAdd]);

            const handleAdd = (id, data) => {
                add(data);
                setIsAdding(false);
            };

            const handleUpdate = (id, data) => {
                update(id, data);
                setEditingId(null);
            };

            const monthlyTotal = sumForTimeframe(income, 'monthly');

            return (
                <div className="space-y-6 pb-24">
                    <h2 className="text-2xl font-semibold text-gray-900">Einkommen</h2>

                    <Card>
                        <div className="flex items-center gap-2 text-gray-600 mb-2">
                            <Wallet />
                            <span className="text-sm font-medium">Gesamteinkommen (Monat)</span>
                        </div>
                        <div className="text-3xl font-semibold text-green-600">{formatEuro(monthlyTotal)}</div>
                    </Card>

                    <div className="space-y-2">
                        {isAdding && (
                            <EditableIncomeRow item={{ id: 'new' }} update={handleAdd} remove={() => {}} isNew={true} onCancel={() => setIsAdding(false)} />
                        )}
                        {income.length === 0 && !isAdding ? (
                            <div className="text-center py-12 text-gray-400">Noch kein Einkommen erfasst</div>
                        ) : income.map(item => (
                            editingId === item.id ? (
                                <EditableIncomeRow key={item.id} item={item} update={handleUpdate} remove={remove} isNew={false} />
                            ) : (
                                <div key={item.id} onClick={() => setEditingId(item.id)} className="bg-white rounded-lg px-4 py-3 flex items-center justify-between hover:shadow-sm hover:border-blue-200 transition-all border border-gray-100 cursor-pointer">
                                    <div className="flex-1">
                                        <div className="font-medium text-gray-900">{item.name}</div>
                                        <div className="text-sm text-gray-500">{INTERVAL_LABELS[item.interval]}</div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <div className="font-semibold text-green-600">{formatEuro(item.amount)}</div>
                                        <button onClick={(e) => { e.stopPropagation(); remove(item.id); }} className="text-gray-400 hover:text-red-500 transition-colors"><Trash2 /></button>
                                    </div>
                                </div>
                            )
                        ))}
                    </div>

                    <button className="fab" onClick={() => setIsAdding(true)}><PlusCircle /> Hinzufügen</button>
                </div>
            );
        }

        // ─── FIXED COSTS ─────────────────────────────────────────────────────
        function FixedCosts({ costs, add, update, remove, triggerAdd }) {
            const [editingId, setEditingId] = useState(null);
            const [isAdding, setIsAdding] = useState(false);

            // Reagiere auf Cmd+N
            useEffect(() => {
                if (triggerAdd > 0) setIsAdding(true);
            }, [triggerAdd]);

            const handleAdd = (id, data) => {
                add(data);
                setIsAdding(false);
            };

            const handleUpdate = (id, data) => {
                update(id, data);
                setEditingId(null);
            };

            const monthlyTotal = sumForTimeframe(costs, 'monthly');

            // Gruppiere nach Turnus
            const intervalOrder = ['monthly', 'quarterly', 'yearly'];
            const grouped = { monthly: [], quarterly: [], yearly: [] };
            costs.forEach(cost => {
                const interval = cost.interval || 'monthly';
                if (grouped[interval]) {
                    grouped[interval].push(cost);
                } else {
                    grouped.monthly.push(cost); // Fallback für unbekannte Intervalle
                }
            });

            const renderCostItem = (cost) => (
                editingId === cost.id ? (
                    <EditableIncomeRow key={cost.id} item={cost} update={handleUpdate} remove={remove} isNew={false} />
                ) : (
                    <div key={cost.id} onClick={() => setEditingId(cost.id)} className="bg-white rounded-lg px-4 py-3 flex items-center justify-between hover:shadow-sm hover:border-blue-200 transition-all border border-gray-100 cursor-pointer">
                        <div className="flex-1">
                            <div className="font-medium text-gray-900">{cost.name}</div>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="font-semibold text-gray-900">{formatEuro(cost.amount)}</div>
                            <button onClick={(e) => { e.stopPropagation(); remove(cost.id); }} className="text-gray-400 hover:text-red-500 transition-colors"><Trash2 /></button>
                        </div>
                    </div>
                )
            );

            return (
                <div className="space-y-6 pb-24">
                    <h2 className="text-2xl font-semibold text-gray-900">Fixkosten</h2>

                    <Card>
                        <div className="flex items-center gap-2 text-gray-600 mb-2">
                            <Receipt />
                            <span className="text-sm font-medium">Gesamte Fixkosten (Monat)</span>
                        </div>
                        <div className="text-3xl font-semibold text-orange-600">{formatEuro(monthlyTotal)}</div>
                    </Card>

                    {isAdding && (
                        <EditableIncomeRow item={{ id: 'new' }} update={handleAdd} remove={() => {}} isNew={true} onCancel={() => setIsAdding(false)} />
                    )}

                    {costs.length === 0 && !isAdding ? (
                        <div className="text-center py-12 text-gray-400">Noch keine Fixkosten erfasst</div>
                    ) : (
                        <div className="space-y-6">
                            {intervalOrder.map(interval => {
                                const items = grouped[interval];
                                if (items.length === 0) return null;
                                const subtotal = items.reduce((sum, c) => sum + parseFloat(c.amount), 0);
                                return (
                                    <div key={interval}>
                                        <div className="flex items-center justify-between mb-3">
                                            <h3 className="text-sm font-semibold text-gray-700 uppercase tracking-wide">{INTERVAL_LABELS[interval]}</h3>
                                            <span className="text-sm text-gray-500">{formatEuro(subtotal)}</span>
                                        </div>
                                        <div className="space-y-2">
                                            {items.map(renderCostItem)}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    <button className="fab" onClick={() => setIsAdding(true)}><PlusCircle /> Hinzufügen</button>
                </div>
            );
        }

        // ─── Inline Editable Row für Ausgaben ────────────────────────────────
        function EditableExpenseRow({ item, categories, update, remove, onAddCategory, isNew, onCancel }) {
            const [data, setData] = useState({
                description: item.description || '',
                amount: item.amount || '',
                category: item.category || categories[0] || '',
                date: item.date || new Date().toISOString().split('T')[0]
            });
            const [showNewCat, setShowNewCat] = useState(false);
            const [newCat, setNewCat] = useState('');
            const inputRef = useRef(null);

            useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

            const save = () => {
                if (!data.description || !data.amount || !data.category) return;
                update(item.id, data);
                if (isNew && onCancel) onCancel();
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); save(); }
                if (e.key === 'Escape' && isNew && onCancel) onCancel();
            };

            const addCat = () => {
                if (newCat && !categories.includes(newCat)) {
                    onAddCategory(newCat);
                    setData({...data, category: newCat});
                    setNewCat('');
                    setShowNewCat(false);
                }
            };

            return (
                <div className="bg-white rounded-lg px-4 py-3 border border-blue-200 shadow-sm space-y-3">
                    {/* Row 1: Description + Amount */}
                    <div className="flex flex-col sm:flex-row gap-2 sm:gap-3">
                        <input ref={inputRef} type="text" value={data.description} onChange={e => setData({...data, description: e.target.value})} onKeyDown={handleKeyDown}
                            placeholder="Beschreibung" className="flex-1 px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" />
                        <input type="number" step="0.01" value={data.amount} onChange={e => setData({...data, amount: e.target.value})} onKeyDown={handleKeyDown}
                            placeholder="Betrag" className="w-full sm:w-24 px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm text-right" />
                    </div>
                    {/* Row 2: Category + Date */}
                    <div className="flex flex-col sm:flex-row gap-2 sm:gap-3">
                        <div className="flex-1 flex items-center gap-2">
                            <select value={data.category} onChange={e => setData({...data, category: e.target.value})} onKeyDown={handleKeyDown}
                                className="flex-1 px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
                                {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                            </select>
                            {showNewCat ? (
                                <div className="flex items-center gap-1">
                                    <input type="text" value={newCat} onChange={e => setNewCat(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCat()}
                                        placeholder="Neue..." className="w-20 sm:w-24 px-2 py-2 sm:py-1 border border-gray-200 rounded text-sm" autoFocus />
                                    <button onClick={addCat} className="text-green-600 hover:text-green-700 p-1"><Check /></button>
                                    <button onClick={() => { setShowNewCat(false); setNewCat(''); }} className="text-gray-400 hover:text-gray-600 p-1"><X /></button>
                                </div>
                            ) : (
                                <button onClick={() => setShowNewCat(true)} className="text-blue-600 hover:text-blue-700 text-xs whitespace-nowrap">+ Neu</button>
                            )}
                        </div>
                        <input type="date" value={data.date} onChange={e => setData({...data, date: e.target.value})} onKeyDown={handleKeyDown}
                            className="w-full sm:w-auto px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" />
                    </div>
                    {/* Row 3: Actions */}
                    <div className="flex justify-end gap-2 pt-2 border-t sm:border-0 border-gray-100 sm:pt-0 sm:hidden">
                        <button onClick={save} className="flex-1 bg-green-50 text-green-600 hover:bg-green-100 transition-colors p-2 rounded flex items-center justify-center gap-2 text-sm font-medium">
                            <Check /> Speichern
                        </button>
                        {isNew ? (
                            <button onClick={onCancel} className="flex-1 bg-gray-50 text-gray-500 hover:bg-gray-100 transition-colors p-2 rounded flex items-center justify-center gap-2 text-sm font-medium">
                                <X /> Abbrechen
                            </button>
                        ) : (
                            <button onClick={() => remove(item.id)} className="bg-gray-50 text-gray-400 hover:bg-red-50 hover:text-red-500 transition-colors p-2 rounded">
                                <Trash2 />
                            </button>
                        )}
                    </div>
                    {/* Desktop Actions (inline) */}
                    <div className="hidden sm:flex sm:justify-end sm:gap-1 sm:-mt-2">
                        <button onClick={save} className="text-green-600 hover:text-green-700 transition-colors p-1"><Check /></button>
                        {isNew ? (
                            <button onClick={onCancel} className="text-gray-400 hover:text-gray-600 transition-colors p-1"><X /></button>
                        ) : (
                            <button onClick={() => remove(item.id)} className="text-gray-400 hover:text-red-500 transition-colors p-1"><Trash2 /></button>
                        )}
                    </div>
                </div>
            );
        }

        // ─── EXPENSES ────────────────────────────────────────────────────────
        function Expenses({ expenses, categories, add, update, remove, onAddCategory, timeframe, setTimeframe, triggerAdd }) {
            const [editingId, setEditingId] = useState(null);
            const [isAdding, setIsAdding] = useState(false);

            // Reagiere auf Cmd+N
            useEffect(() => {
                if (triggerAdd > 0) setIsAdding(true);
            }, [triggerAdd]);

            const handleAdd = (id, data) => {
                add(data);
                setIsAdding(false);
            };

            const handleUpdate = (id, data) => {
                update(id, data);
                setEditingId(null);
            };

            const filtered = getExpensesInTimeframe(expenses, timeframe).sort((a, b) => new Date(b.date) - new Date(a.date));
            const tfTotal = filtered.reduce((s, e) => s + parseFloat(e.amount), 0);

            return (
                <div className="space-y-6 pb-24">
                    <div className="flex items-center justify-between">
                        <h2 className="text-2xl font-semibold text-gray-900">Ausgaben</h2>
                        <TimeframeFilter timeframe={timeframe} setTimeframe={setTimeframe} />
                    </div>

                    {/* Summen-Karte */}
                    <Card>
                        <div className="flex items-center gap-2 text-gray-600 mb-2">
                            <TrendingDown />
                            <span className="text-sm font-medium">Gesamte Ausgaben ({LABELS[timeframe]})</span>
                        </div>
                        <div className="text-3xl font-semibold text-gray-900">{formatEuro(tfTotal)}</div>
                        <div className="text-sm text-gray-500 mt-1">{filtered.length} Einträge</div>
                    </Card>

                    {/* Chart */}
                    <Card>
                        <CardTitle icon={<TrendingDown />}>Ausgaben über Zeit</CardTitle>
                        <div className="mt-4">
                            <ExpenseChart expenses={expenses} timeframe={timeframe} />
                        </div>
                    </Card>

                    {/* Liste */}
                    <div className="space-y-2">
                        {isAdding && (
                            <EditableExpenseRow item={{ id: 'new' }} categories={categories} update={handleAdd} remove={() => {}} onAddCategory={onAddCategory} isNew={true} onCancel={() => setIsAdding(false)} />
                        )}
                        {filtered.length === 0 && !isAdding ? (
                            <div className="text-center py-12 text-gray-400">Keine Ausgaben in diesem Zeitraum</div>
                        ) : filtered.map(expense => (
                            editingId === expense.id ? (
                                <EditableExpenseRow key={expense.id} item={expense} categories={categories} update={handleUpdate} remove={remove} onAddCategory={onAddCategory} isNew={false} />
                            ) : (
                                <div key={expense.id} onClick={() => setEditingId(expense.id)} className="bg-white rounded-lg px-4 py-3 flex items-center justify-between hover:shadow-sm hover:border-blue-200 transition-all border border-gray-100 cursor-pointer">
                                    <div className="flex-1">
                                        <div className="font-medium text-gray-900">{expense.description}</div>
                                        <div className="text-sm text-gray-500">{expense.category} · {formatDate(expense.date)}</div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <div className="font-semibold text-gray-900">{formatEuro(expense.amount)}</div>
                                        <button onClick={(e) => { e.stopPropagation(); remove(expense.id); }} className="text-gray-400 hover:text-red-500 transition-colors"><Trash2 /></button>
                                    </div>
                                </div>
                            )
                        ))}
                    </div>

                    <button className="fab" onClick={() => setIsAdding(true)}><PlusCircle /> Hinzufügen</button>
                </div>
            );
        }

        // ─── Inline Editable Row für Sparbeträge ─────────────────────────────────
        function EditableSavingsRow({ item, update, remove, isNew, onCancel }) {
            const [data, setData] = useState({
                name: item.name || '',
                amount: item.amount || '',
                interval: item.interval || 'monthly'
            });
            const inputRef = useRef(null);

            useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

            const save = () => {
                if (!data.name || !data.amount) return;
                update(item.id, data);
                if (isNew && onCancel) onCancel();
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); save(); }
                if (e.key === 'Escape' && isNew && onCancel) onCancel();
            };

            return (
                <div className="bg-white rounded-lg px-4 py-3 border border-blue-200 shadow-sm">
                    <div className="flex items-center gap-3">
                        <input ref={inputRef} type="text" value={data.name} onChange={e => setData({...data, name: e.target.value})} onKeyDown={handleKeyDown}
                            placeholder="Bezeichnung (z.B. ETF-Sparplan)" className="flex-1 px-2 py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" />
                        <input type="number" step="0.01" value={data.amount} onChange={e => setData({...data, amount: e.target.value})} onKeyDown={handleKeyDown}
                            placeholder="Betrag" className="w-24 px-2 py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm text-right" />
                        <select value={data.interval} onChange={e => setData({...data, interval: e.target.value})} onKeyDown={handleKeyDown}
                            className="px-2 py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
                            <option value="weekly">Wöchentlich</option>
                            <option value="monthly">Monatlich</option>
                            <option value="quarterly">Quartalsweise</option>
                            <option value="yearly">Jährlich</option>
                        </select>
                        <button onClick={save} className="text-green-600 hover:text-green-700 transition-colors p-1"><Check /></button>
                        {isNew ? (
                            <button onClick={onCancel} className="text-gray-400 hover:text-gray-600 transition-colors p-1"><X /></button>
                        ) : (
                            <button onClick={() => remove(item.id)} className="text-gray-400 hover:text-red-500 transition-colors p-1"><Trash2 /></button>
                        )}
                    </div>
                </div>
            );
        }

        // ─── SAVINGS ──────────────────────────────────────────────────────────
        function Savings({ savings, add, update, remove, income, fixedCosts, expenses, triggerAdd }) {
            const [editingId, setEditingId] = useState(null);
            const [isAdding, setIsAdding] = useState(false);

            // Reagiere auf Cmd+N
            useEffect(() => {
                if (triggerAdd > 0) setIsAdding(true);
            }, [triggerAdd]);

            const handleAdd = (id, data) => {
                add(data);
                setIsAdding(false);
            };

            const handleUpdate = (id, data) => {
                update(id, data);
                setEditingId(null);
            };

            const monthlyTotal = sumForTimeframe(savings, 'monthly');
            const monthlyIncome = sumForTimeframe(income, 'monthly');
            const monthlyFixed = sumForTimeframe(fixedCosts, 'monthly');
            const monthlyExpenses = getExpensesInTimeframe(expenses, 'monthly').reduce((s, e) => s + parseFloat(e.amount), 0);
            const available = monthlyIncome - monthlyFixed - monthlyExpenses;
            const savingsRate = monthlyIncome > 0 ? (monthlyTotal / monthlyIncome) * 100 : 0;

            return (
                <div className="space-y-6 pb-24">
                    <h2 className="text-2xl font-semibold text-gray-900">Sparen</h2>

                    {/* Übersichtskarten */}
                    <div className="grid md:grid-cols-2 gap-4">
                        <Card>
                            <div className="flex items-center gap-2 text-gray-600 mb-2">
                                <Piggybank />
                                <span className="text-sm font-medium">Monatliche Sparrate</span>
                            </div>
                            <div className="text-3xl font-semibold text-blue-600">{formatEuro(monthlyTotal)}</div>
                            <div className="text-sm text-gray-500 mt-1">{savingsRate.toFixed(0)}% vom Einkommen</div>
                        </Card>
                        <Card>
                            <div className="flex items-center gap-2 text-gray-600 mb-2">
                                <Wallet />
                                <span className="text-sm font-medium">Noch verfügbar</span>
                            </div>
                            <div className={`text-3xl font-semibold ${available - monthlyTotal >= 0 ? 'text-gray-900' : 'text-red-600'}`}>
                                {formatEuro(available - monthlyTotal)}
                            </div>
                            <div className="text-sm text-gray-500 mt-1">nach Sparen</div>
                        </Card>
                    </div>

                    {/* Empfehlung */}
                    {savingsRate < 10 && monthlyIncome > 0 && (
                        <div className="bg-amber-50 border border-amber-200 rounded-lg p-4 flex items-start gap-3">
                            <AlertCircle className="text-amber-600 mt-0.5" />
                            <div>
                                <div className="font-medium text-amber-800">Sparquote unter 10%</div>
                                <div className="text-sm text-amber-700 mt-1">
                                    Experten empfehlen mindestens 10-20% des Einkommens zu sparen.
                                    Mit {formatEuro(monthlyIncome * 0.1)} pro Monat würdest du die 10%-Marke erreichen.
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Sparbeträge Liste */}
                    <div className="space-y-2">
                        {isAdding && (
                            <EditableSavingsRow item={{ id: 'new' }} update={handleAdd} remove={() => {}} isNew={true} onCancel={() => setIsAdding(false)} />
                        )}
                        {savings.length === 0 && !isAdding ? (
                            <Card>
                                <div className="text-center py-8">
                                    <Piggybank className="mx-auto text-gray-300 mb-3" />
                                    <div className="text-gray-500">Noch keine Sparbeträge erfasst</div>
                                    <div className="text-sm text-gray-400 mt-1">Füge deine regelmäßigen Sparbeträge hinzu</div>
                                </div>
                            </Card>
                        ) : savings.map(item => {
                            const monthlyAmount = convertToTimeframe(item.amount, item.interval, 'monthly');

                            return editingId === item.id ? (
                                <EditableSavingsRow key={item.id} item={item} update={handleUpdate} remove={remove} isNew={false} />
                            ) : (
                                <div key={item.id} onClick={() => setEditingId(item.id)} className="bg-white rounded-lg px-4 py-3 hover:shadow-sm hover:border-blue-200 transition-all border border-gray-100 cursor-pointer">
                                    <div className="flex items-center justify-between">
                                        <div className="flex-1">
                                            <div className="font-medium text-gray-900">{item.name}</div>
                                            <div className="text-sm text-gray-500">{INTERVAL_LABELS[item.interval]}</div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <div className="text-right">
                                                <div className="font-semibold text-blue-600">{formatEuro(item.amount)}</div>
                                                {item.interval !== 'monthly' && <div className="text-xs text-gray-500">{formatEuro(monthlyAmount)}/Monat</div>}
                                            </div>
                                            <button onClick={(e) => { e.stopPropagation(); remove(item.id); }} className="text-gray-400 hover:text-red-500 transition-colors"><Trash2 /></button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <button className="fab" onClick={() => setIsAdding(true)}><PlusCircle /> Hinzufügen</button>
                </div>
            );
        }

        ReactDOM.render(<FinanceTracker />, document.getElementById('root'));
    </script>
</body>
</html>
