        // ─── Helpers ─────────────────────────────────────────────────────────
        const LABELS = { weekly: 'Woche', monthly: 'Monat', yearly: 'Jahr' };
        const INTERVAL_LABELS = { weekly: 'Wöchentlich', monthly: 'Monatlich', quarterly: 'Quartalsweise', yearly: 'Jährlich' };

        function convertToTimeframe(amount, fromInterval, toTimeframe) {
            const a = parseFloat(amount);
            if (toTimeframe === 'weekly') {
                if (fromInterval === 'weekly') return a;
                if (fromInterval === 'monthly') return a / 4.33;
                if (fromInterval === 'quarterly') return a / 13;
                if (fromInterval === 'yearly') return a / 52;
            } else if (toTimeframe === 'monthly') {
                if (fromInterval === 'monthly') return a;
                if (fromInterval === 'quarterly') return a / 3;
                if (fromInterval === 'yearly') return a / 12;
                if (fromInterval === 'weekly') return a * 4.33;
            } else if (toTimeframe === 'yearly') {
                if (fromInterval === 'yearly') return a;
                if (fromInterval === 'quarterly') return a * 4;
                if (fromInterval === 'monthly') return a * 12;
                if (fromInterval === 'weekly') return a * 52;
            }
            return a;
        }

        function sumForTimeframe(items, timeframe) {
            return items.reduce((sum, item) => sum + convertToTimeframe(item.amount, item.interval, timeframe), 0);
        }

        function getExpensesInTimeframe(expenses, timeframe) {
            const now = new Date();
            return expenses.filter(e => {
                const diff = (now - new Date(e.date)) / (1000 * 60 * 60 * 24);
                if (timeframe === 'weekly') return diff <= 7;
                if (timeframe === 'monthly') return diff <= 30;
                if (timeframe === 'yearly') return diff <= 365;
                return true;
            });
        }

        function formatEuro(amount) {
            return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(amount);
        }

        function formatDate(d) {
            return new Date(d).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        // ─── C24 PDF Parser ───────────────────────────────────────────────────
        async function parseC24PDF(arrayBuffer) {
            try {
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                // Extract year from document (from header like "Kontoauszug 01/2026")
                let documentYear = new Date().getFullYear();

                // Get all text items with positions for better parsing
                let allItems = [];

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();

                    // Check for year in header
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    const yearMatch = pageText.match(/Kontoauszug\s+\d{2}\/(\d{4})/);
                    if (yearMatch) {
                        documentYear = parseInt(yearMatch[1]);
                    }

                    // Store items with their positions
                    textContent.items.forEach(item => {
                        if (item.str.trim()) {
                            allItems.push({
                                text: item.str.trim(),
                                x: Math.round(item.transform[4]),
                                y: Math.round(item.transform[5]),
                                page: pageNum
                            });
                        }
                    });
                }

                // Sort by page, then by Y (descending - top to bottom), then by X
                allItems.sort((a, b) => {
                    if (a.page !== b.page) return a.page - b.page;
                    if (Math.abs(a.y - b.y) > 5) return b.y - a.y; // Different lines
                    return a.x - b.x; // Same line, left to right
                });

                // Group items by lines (items with similar Y positions)
                const lines = [];
                let currentLine = [];
                let lastY = null;
                let lastPage = null;

                allItems.forEach(item => {
                    if (lastY === null || lastPage !== item.page || Math.abs(item.y - lastY) > 5) {
                        if (currentLine.length > 0) {
                            lines.push({ items: currentLine, y: lastY, page: lastPage });
                        }
                        currentLine = [item];
                        lastY = item.y;
                        lastPage = item.page;
                    } else {
                        currentLine.push(item);
                    }
                });
                if (currentLine.length > 0) {
                    lines.push({ items: currentLine, y: lastY, page: lastPage });
                }

                // Parse transactions from lines
                // C24 Format: Buchung | Valuta | Transaktionsinformation | Betrag
                // Date format: DD.MM. (without year)
                // Amount format: + 1.000,00 € or - 500,00 €

                const transactions = [];
                let currentTransaction = null;

                // Patterns
                const datePattern = /^(\d{2})\.(\d{2})\.$/;
                const amountPattern = /^([+-])\s*([\d.]+,\d{2})\s*€$/;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const lineText = line.items.map(it => it.text).join(' ');

                    // Skip header/footer lines
                    if (lineText.includes('Buchung') && lineText.includes('Valuta') && lineText.includes('Betrag')) continue;
                    if (lineText.includes('IBAN:') && lineText.includes('BIC:') && !lineText.match(/[+-]\s*[\d.]+,\d{2}\s*€/)) continue;
                    if (lineText.includes('C24 Bank GmbH')) continue;
                    if (lineText.includes('Seite') && lineText.includes('von')) continue;
                    if (lineText.includes('Kontoauszug') && lineText.includes('/')) continue;
                    if (lineText.includes('Transaktionsübersicht')) continue;
                    if (lineText.includes('Kontostand') && !lineText.match(/[+-]\s*[\d.]+,\d{2}\s*€/)) continue;
                    if (lineText.includes('Dispokredit')) continue;
                    if (lineText.includes('Zusammenfassung')) continue;
                    if (lineText.includes('Startsaldo')) continue;
                    if (lineText.includes('Endsaldo')) continue;
                    if (lineText.includes('Kontobelastungen')) continue;
                    if (lineText.includes('Kontogutschriften')) continue;
                    if (lineText.includes('Weitere Informationen')) continue;
                    if (lineText.includes('Einwendungen gegen')) continue;
                    if (lineText.includes('Hinweis zur')) continue;
                    if (lineText.includes('C24 Smartkonto')) continue;
                    if (lineText.match(/^Girokonto$/)) continue;
                    if (lineText.includes('Ust.-ID')) continue;
                    if (lineText.includes('Neue Mainzer')) continue;

                    // Check if line starts with a date (DD.MM.)
                    const firstItem = line.items[0];
                    const dateMatch = firstItem?.text.match(datePattern);

                    if (dateMatch) {
                        // Save previous transaction
                        if (currentTransaction && currentTransaction.amount !== null) {
                            transactions.push(currentTransaction);
                        }

                        // Start new transaction
                        const day = dateMatch[1];
                        const month = dateMatch[2];
                        const dateStr = `${documentYear}-${month}-${day}`;

                        currentTransaction = {
                            date: dateStr,
                            description: '',
                            descriptionParts: [],
                            amount: null,
                            type: null,
                            category: null
                        };

                        // Parse rest of line - look for transaction type and amount
                        // Items are sorted by X position
                        let foundAmount = false;
                        let skipNextDate = false;

                        for (let j = 1; j < line.items.length; j++) {
                            const item = line.items[j];

                            // Skip valuta date (second date column)
                            if (item.text.match(datePattern)) {
                                skipNextDate = true;
                                continue;
                            }

                            // Check for amount (usually at the end, rightmost)
                            const amountMatch = item.text.match(amountPattern);
                            if (amountMatch) {
                                const sign = amountMatch[1];
                                let amountStr = amountMatch[2].replace(/\./g, '').replace(',', '.');
                                const amount = parseFloat(amountStr);
                                currentTransaction.amount = amount;
                                currentTransaction.type = sign === '+' ? 'income' : 'expense';
                                foundAmount = true;
                            } else if (!foundAmount) {
                                // This is part of the description
                                currentTransaction.descriptionParts.push(item.text);
                            }
                        }
                    } else if (currentTransaction && currentTransaction.amount !== null) {
                        // Continuation of current transaction description
                        // Skip IBAN/BIC lines for description but still collect other details
                        const isIbanLine = lineText.includes('IBAN:');

                        if (!isIbanLine) {
                            // Add to description
                            line.items.forEach(item => {
                                // Skip amounts and dates
                                if (!item.text.match(amountPattern) && !item.text.match(datePattern)) {
                                    currentTransaction.descriptionParts.push(item.text);
                                }
                            });
                        }
                    }
                }

                // Don't forget the last transaction
                if (currentTransaction && currentTransaction.amount !== null) {
                    transactions.push(currentTransaction);
                }

                // Process descriptions
                transactions.forEach(t => {
                    // Combine description parts
                    let desc = t.descriptionParts.join(' ').trim();

                    // Clean up common patterns
                    desc = desc.replace(/\s+/g, ' ');

                    t.description = desc || 'Transaktion';
                    delete t.descriptionParts;
                });

                if (transactions.length === 0) {
                    return {
                        transactions: [],
                        error: 'Keine Transaktionen gefunden. Bitte stelle sicher, dass es sich um einen C24 Kontoauszug handelt.',
                        rawText: lines.slice(0, 50).map(l => l.items.map(i => i.text).join(' ')).join('\n')
                    };
                }

                // Sort by date (newest first)
                transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

                return {
                    transactions,
                    stats: {
                        total: transactions.length,
                        income: transactions.filter(t => t.type === 'income').length,
                        expenses: transactions.filter(t => t.type === 'expense').length,
                        totalIncome: transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0),
                        totalExpenses: transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0)
                    }
                };
            } catch (e) {
                console.error('PDF parsing error:', e);
                return {
                    transactions: [],
                    error: 'Fehler beim Lesen der PDF: ' + e.message
                };
            }
        }

        // Kategorie-Erkennung basierend auf Beschreibung
        function detectCategory(description, existingCategories) {
            const desc = description.toLowerCase();

            const categoryPatterns = {
                'Lebensmittel': ['rewe', 'edeka', 'aldi', 'lidl', 'penny', 'netto', 'kaufland', 'supermarkt', 'dm-drogerie', 'rossmann'],
                'Transport': ['db ', 'deutsche bahn', 'shell', 'aral', 'jet ', 'total ', 'esso', 'tankstelle', 'uber', 'taxi', 'flixbus', 'tier', 'lime', 'car2go', 'share now'],
                'Unterhaltung': ['netflix', 'spotify', 'amazon prime', 'disney', 'kino', 'cinema', 'concert', 'konzert', 'theater'],
                'Restaurant': ['restaurant', 'cafe', 'lieferando', 'lieferheld', 'uber eats', 'mcdonalds', 'burger king', 'subway', 'pizza', 'sushi'],
                'Gesundheit': ['apotheke', 'arzt', 'doctor', 'pharmacy', 'krankenhaus', 'hospital', 'optiker'],
                'Shopping': ['amazon', 'zalando', 'h&m', 'zara', 'mediamarkt', 'saturn', 'ikea', 'ebay'],
                'Wohnen': ['miete', 'strom', 'gas', 'wasser', 'heizung', 'versicherung', 'gez', 'rundfunk'],
                'Kommunikation': ['telekom', 'vodafone', 'o2', 'telefon', 'internet', 'mobilfunk'],
                'Gehalt': ['gehalt', 'lohn', 'salary', 'vergütung', 'auszahlung'],
                'Überweisung': ['überweisung', 'transfer']
            };

            for (const [category, keywords] of Object.entries(categoryPatterns)) {
                if (keywords.some(keyword => desc.includes(keyword))) {
                    // Return existing category if it matches, otherwise return detected
                    const existing = existingCategories.find(c => c.toLowerCase() === category.toLowerCase());
                    return existing || category;
                }
            }

            return null;
        }

        // Erkennt ob eine Transaktion ein Gehalt/regelmäßiges Einkommen ist
        function detectIncome(description, amount) {
            const desc = description.toLowerCase();

            // Gehalt/Lohn Patterns
            const salaryPatterns = [
                { patterns: ['lohn/gehalt', 'lohn / gehalt', 'gehalt/', 'lohn/', 'gehaltseingang'], name: 'Gehalt', type: 'salary' },
                { patterns: ['gehalt', 'salary', 'vergütung', 'entgelt', 'bezüge'], name: 'Gehalt', type: 'salary' },
                { patterns: ['lohn'], name: 'Lohn', type: 'salary' },
            ];

            // Rente/Pension
            const pensionPatterns = [
                { patterns: ['rente', 'pension', 'altersrente', 'erwerbsminderung'], name: 'Rente', type: 'pension' },
                { patterns: ['deutsche rentenversicherung', 'drv '], name: 'Rente', type: 'pension' },
            ];

            // Staatliche Leistungen
            const benefitPatterns = [
                { patterns: ['kindergeld'], name: 'Kindergeld', type: 'benefit' },
                { patterns: ['arbeitslosengeld', 'alg ', 'alg1', 'alg2', 'bürgergeld'], name: 'Arbeitslosengeld', type: 'benefit' },
                { patterns: ['wohngeld'], name: 'Wohngeld', type: 'benefit' },
                { patterns: ['elterngeld'], name: 'Elterngeld', type: 'benefit' },
                { patterns: ['bafög', 'bafoeg'], name: 'BAföG', type: 'benefit' },
            ];

            // Mieteinnahmen
            const rentalPatterns = [
                { patterns: ['mieteinnahme', 'miete von', 'mieteingang'], name: 'Mieteinnahmen', type: 'rental' },
            ];

            // Dividenden/Kapitalerträge
            const investmentPatterns = [
                { patterns: ['dividende', 'ausschüttung', 'kapitalertrag', 'zinsgutschrift'], name: 'Kapitalerträge', type: 'investment' },
            ];

            const allPatterns = [
                ...salaryPatterns,
                ...pensionPatterns,
                ...benefitPatterns,
                ...rentalPatterns,
                ...investmentPatterns
            ];

            for (const pattern of allPatterns) {
                if (pattern.patterns.some(p => desc.includes(p))) {
                    return {
                        name: pattern.name,
                        type: pattern.type,
                        interval: 'monthly',
                        isIncome: true
                    };
                }
            }

            // Heuristik: Größere Überweisungseingänge könnten Gehalt sein
            // Aber nur wenn es eine Überweisung ist und der Betrag typisch für Gehalt ist
            if (desc.includes('überweisung') && amount >= 500 && amount <= 15000) {
                // Prüfe ob es von einer Firma kommt (nicht von Privatperson)
                const companyIndicators = ['gmbh', 'ag', 'kg', 'ohg', 'ug', 'inc', 'ltd', 'corp', 'co.'];

                        name: 'Mögliches Gehalt',
                        type: 'salary',
                        interval: 'monthly',
                        isIncome: true,
                        uncertain: true
                    };
                }
            }

            return null;
        }

        // ─── Build chart buckets depending on timeframe ─────────────────────
        function buildChartData(expenses, timeframe) {
            const now = new Date();
            const buckets = [];

            if (timeframe === 'weekly') {
                // 7 buckets: one per day, labeled Mo Di Mi ...
                const dayNames = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date(now);
                    d.setDate(d.getDate() - i);
                    buckets.push({ label: dayNames[d.getDay()], total: 0 });
                }
                expenses.forEach(e => {
                    const diff = Math.floor((now - new Date(e.date)) / (1000 * 60 * 60 * 24));
                    if (diff >= 0 && diff <= 6) {
                        buckets[6 - diff].total += parseFloat(e.amount);
                    }
                });
            } else if (timeframe === 'monthly') {
                // 4 buckets: KW 1–4 (je 7 Tage)
                for (let i = 0; i < 4; i++) {
                    buckets.push({ label: 'KW ' + (i + 1), total: 0 });
                }
                expenses.forEach(e => {
                    const diff = (now - new Date(e.date)) / (1000 * 60 * 60 * 24);
                    if (diff >= 0 && diff <= 30) {
                        const week = Math.min(Math.floor(diff / 7), 3);
                        buckets[3 - week].total += parseFloat(e.amount);
                    }
                });
            } else if (timeframe === 'yearly') {
                // 12 buckets: Jan–Dez
                const monthNames = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
                for (let i = 0; i < 12; i++) {
                    buckets.push({ label: monthNames[i], total: 0 });
                }
                expenses.forEach(e => {
                    const d = new Date(e.date);
                    const diff = (now - d) / (1000 * 60 * 60 * 24);
                    if (diff >= 0 && diff <= 365) {
                        buckets[d.getMonth()].total += parseFloat(e.amount);
                    }
                });
            }
            return buckets;
        }

        // ─── Pure-SVG Bar Chart ──────────────────────────────────────────────
        function ExpenseChart({ expenses, timeframe }) {
            const containerRef = useRef(null);
            const [width, setWidth] = useState(600);

            useEffect(() => {
                const measure = () => {
                    if (containerRef.current) setWidth(containerRef.current.clientWidth);
                };
                measure();
                window.addEventListener('resize', measure);
                return () => window.removeEventListener('resize', measure);
            }, []);

            const data = buildChartData(getExpensesInTimeframe(expenses, timeframe), timeframe);
            const maxVal = Math.max(...data.map(d => d.total), 1);

            const padL = 60, padR = 16, padT = 12, padB = 36;
            const chartW = width - padL - padR;
            const chartH = 160;
            const barW = Math.max((chartW / data.length) * 0.55, 8);
            const gap = chartW / data.length;

            // Y-Achse: 3 Stufen
            const ySteps = [0, maxVal / 2, maxVal];

            return (
                <div ref={containerRef} className="w-full">
                    <svg width={width} height={chartH + padT + padB} style={{ display: 'block' }}>
                        {/* Horizontale Gridlines + Labels */}
                        {ySteps.map((val, i) => {
                            const y = padT + chartH - (val / maxVal) * chartH;
                            return (
                                <g key={i}>
                                    <line x1={padL} y1={y} x2={width - padR} y2={y} stroke="#f0f0f0" strokeWidth="1" />
                                    <text x={padL - 8} y={y + 4} textAnchor="end" fontSize="10" fill="#9ca3af" fontFamily="inherit">
                                        {val === 0 ? '0 €' : (val >= 1000 ? (val/1000).toFixed(1) + 'k' : Math.round(val)) + ' €'}
                                    </text>
                                </g>
                            );
                        })}

                        {/* Balken + X-Labels */}
                        {data.map((d, i) => {
                            const barH = (d.total / maxVal) * chartH;
                            const x = padL + i * gap + (gap - barW) / 2;
                            const y = padT + chartH - barH;
                            return (
                                <g key={i}>
                                    <rect x={x} y={y} width={barW} height={barH} rx="4" fill={d.total > 0 ? '#3b82f6' : '#e5e7eb'} />
                                    {/* Wert-Label oben */}
                                    {d.total > 0 && (
                                        <text x={x + barW / 2} y={y - 5} textAnchor="middle" fontSize="9" fill="#6b7280" fontFamily="inherit">
                                            {d.total >= 1000 ? (d.total/1000).toFixed(1) + 'k' : Math.round(d.total)}€
                                        </text>
                                    )}
                                    {/* X-Achse Label */}
                                    <text x={x + barW / 2} y={padT + chartH + 20} textAnchor="middle" fontSize="10" fill="#9ca3af" fontFamily="inherit">
                                        {d.label}
                                    </text>
                                </g>
                            );
                        })}
                    </svg>
                </div>
            );
        }

            useEffect(() => { loadData(); }, []);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
                        e.preventDefault();
                        // Wechsle zur passenden Seite falls auf Analyse
                        if (view === 'analysis') {
                            setView('expenses');

                return () => window.removeEventListener('keydown', handleKeyDown);

            const loadData = async () => {
                try {
                    const [f, e, c, i, s, t] = await Promise.all([
                        storage.get('fixed-costs').catch(() => null),
                        storage.get('expenses').catch(() => null),
                        storage.get('categories').catch(() => null),
                        storage.get('income').catch(() => null),
                        storage.get('savings').catch(() => null),
                        storage.get('transactions').catch(() => null)

                    if (e?.value) setExpenses(JSON.parse(e.value));
                    if (c?.value) setCategories(JSON.parse(c.value));
                    if (i?.value) setIncome(JSON.parse(i.value));
                    if (s?.value) setSavings(JSON.parse(s.value));
                    if (t?.value) setTransactions(JSON.parse(t.value));

                finally { setLoading(false); }

                add: (item) => { const u = [...list, { ...item, id: Date.now() }]; setList(u); save(key, u); },

                    setList(u);
                    save(key, u);

                remove: (id) => { const u = list.filter(i => i.id !== id); setList(u); save(key, u); }

        // ─── ANALYSIS ─────────────────────────────────────────────────────────
        function Analysis({ fixedCosts, expenses, income, savings, timeframe, setTimeframe }) {
            const tfIncome = sumForTimeframe(income, timeframe);
            const tfFixed = sumForTimeframe(fixedCosts, timeframe);
            const tfSavings = sumForTimeframe(savings, timeframe);
            const tfExpenses = getExpensesInTimeframe(expenses, timeframe).reduce((s, e) => s + parseFloat(e.amount), 0);
            const available = tfIncome - tfFixed - tfSavings;
            const remaining = available - tfExpenses;

            // Prozentuale Aufteilung
            const fixedPct = tfIncome > 0 ? (tfFixed / tfIncome) * 100 : 0;
            const savingsPct = tfIncome > 0 ? (tfSavings / tfIncome) * 100 : 0;
            const expensesPct = tfIncome > 0 ? (tfExpenses / tfIncome) * 100 : 0;
            const remainingPct = tfIncome > 0 ? (remaining / tfIncome) * 100 : 0;

            // Ausgaben nach Kategorie
            const byCategory = {};
            getExpensesInTimeframe(expenses, timeframe).forEach(e => {
                byCategory[e.category] = (byCategory[e.category] || 0) + parseFloat(e.amount);
            });

            // Top Fixkosten
            const topFixed = [...fixedCosts].sort((a, b) => convertToTimeframe(b.amount, b.interval, timeframe) - convertToTimeframe(a.amount, a.interval, timeframe)).slice(0, 5);

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <h2 className="text-2xl font-semibold text-gray-900">Analyse</h2>
                        <TimeframeFilter timeframe={timeframe} setTimeframe={setTimeframe} />

        // ─── Inline Editable Row für Einkommen/Fixkosten ─────────────────────
        function EditableIncomeRow({ item, update, remove, isNew, onCancel }) {
            const [data, setData] = useState({ name: item.name || '', amount: item.amount || '', interval: item.interval || 'monthly' });
            const inputRef = useRef(null);

            useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

            const save = () => {
                if (!data.name || !data.amount) return;
                update(item.id, data);
                if (isNew && onCancel) onCancel();
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); save(); }
                if (e.key === 'Escape' && isNew && onCancel) onCancel();
            };

            return (
                <div className="bg-white rounded-lg px-4 py-3 border border-blue-200 shadow-sm">
                    <div className="space-y-2 sm:space-y-0 sm:flex sm:items-center sm:gap-3">
                        <input ref={inputRef} type="text" value={data.name} onChange={e => setData({...data, name: e.target.value})} onKeyDown={handleKeyDown}
                            placeholder="Bezeichnung" className="w-full sm:flex-1 px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" />
                        <div className="flex gap-2 sm:gap-3">
                            <input type="number" step="0.01" value={data.amount} onChange={e => setData({...data, amount: e.target.value})} onKeyDown={handleKeyDown}
                                placeholder="Betrag" className="flex-1 sm:w-24 sm:flex-none px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm text-right" />
                            <select value={data.interval} onChange={e => setData({...data, interval: e.target.value})} onKeyDown={handleKeyDown}
                                className="flex-1 sm:flex-none px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
                                <option value="weekly">Wöchentlich</option>
                                <option value="monthly">Monatlich</option>
                                <option value="quarterly">Quartalsweise</option>
                                <option value="yearly">Jährlich</option>
                            </select>
                        </div>
                        <div className="flex justify-end gap-2 pt-2 sm:pt-0 border-t sm:border-0 border-gray-100">
                            <button onClick={save} className="flex-1 sm:flex-none bg-green-50 text-green-600 hover:bg-green-100 sm:bg-transparent sm:hover:bg-transparent transition-colors p-2 sm:p-1 rounded sm:rounded-none"><Check /></button>
                            {isNew ? (
                                <button onClick={onCancel} className="flex-1 sm:flex-none bg-gray-50 text-gray-400 hover:bg-gray-100 sm:bg-transparent sm:hover:bg-transparent hover:text-gray-600 transition-colors p-2 sm:p-1 rounded sm:rounded-none"><X /></button>
                            ) : (
                                <button onClick={() => remove(item.id)} className="flex-1 sm:flex-none bg-gray-50 text-gray-400 hover:bg-red-50 sm:bg-transparent sm:hover:bg-transparent hover:text-red-500 transition-colors p-2 sm:p-1 rounded sm:rounded-none"><Trash2 /></button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ─── INCOME ──────────────────────────────────────────────────────────
        function Income({ income, add, update, remove, triggerAdd }) {
            const [editingId, setEditingId] = useState(null);
            const [isAdding, setIsAdding] = useState(false);

            // Reagiere auf Cmd+N
            useEffect(() => {
                if (triggerAdd > 0) setIsAdding(true);
            }, [triggerAdd]);

            const handleAdd = (id, data) => {
                add(data);
                setIsAdding(false);
            };

            const handleUpdate = (id, data) => {
                update(id, data);
                setEditingId(null);
            };

            const monthlyTotal = sumForTimeframe(income, 'monthly');

            return (
                <div className="space-y-6 pb-24">
                    <h2 className="text-2xl font-semibold text-gray-900">Einkommen</h2>

                    <Card>

                            <Wallet />
                            <span className="text-sm font-medium">Gesamteinkommen (Monat)</span>

                        <div className="text-3xl font-semibold text-green-600">{formatEuro(monthlyTotal)}</div>
                    </Card>

                    <div className="space-y-2">
                        {isAdding && (
                            <EditableIncomeRow item={{ id: 'new' }} update={handleAdd} remove={() => {}} isNew={true} onCancel={() => setIsAdding(false)} />
                        )}
                        {income.length === 0 && !isAdding ? (
                            <div className="text-center py-12 text-gray-400">Noch kein Einkommen erfasst</div>
                        ) : income.map(item => (
                            editingId === item.id ? (
                                <EditableIncomeRow key={item.id} item={item} update={handleUpdate} remove={remove} isNew={false} />
                            ) : (
                                <div key={item.id} onClick={() => setEditingId(item.id)} className="bg-white rounded-lg px-4 py-3 flex items-center justify-between hover:shadow-sm hover:border-blue-200 transition-all border border-gray-100 cursor-pointer">
                                    <div className="flex-1">
                                        <div className="font-medium text-gray-900">{item.name}</div>
                                        <div className="text-sm text-gray-500">{INTERVAL_LABELS[item.interval]}</div>
                                    </div>

                                        <div className="font-semibold text-green-600">{formatEuro(item.amount)}</div>
                                        <button onClick={(e) => { e.stopPropagation(); remove(item.id); }} className="text-gray-400 hover:text-red-500 transition-colors"><Trash2 /></button>
                                    </div>
                                </div>

                        ))}

                    <button className="fab" onClick={() => setIsAdding(true)}><PlusCircle /> Hinzufügen</button>

        // ─── FIXED COSTS ─────────────────────────────────────────────────────
        function FixedCosts({ costs, add, update, remove, triggerAdd }) {
            const [editingId, setEditingId] = useState(null);
            const [isAdding, setIsAdding] = useState(false);

            // Reagiere auf Cmd+N
            useEffect(() => {
                if (triggerAdd > 0) setIsAdding(true);
            }, [triggerAdd]);

            const handleAdd = (id, data) => {
                add(data);
                setIsAdding(false);
            };

            const handleUpdate = (id, data) => {
                update(id, data);
                setEditingId(null);
            };

            const monthlyTotal = sumForTimeframe(costs, 'monthly');

            // Gruppiere nach Turnus
            const intervalOrder = ['monthly', 'quarterly', 'yearly'];
            const grouped = { monthly: [], quarterly: [], yearly: [] };
            costs.forEach(cost => {
                const interval = cost.interval || 'monthly';
                if (grouped[interval]) {
                    grouped[interval].push(cost);
                } else {
                    grouped.monthly.push(cost); // Fallback für unbekannte Intervalle
                }
            });

            const renderCostItem = (cost) => (
                editingId === cost.id ? (
                    <EditableIncomeRow key={cost.id} item={cost} update={handleUpdate} remove={remove} isNew={false} />
                ) : (
                    <div key={cost.id} onClick={() => setEditingId(cost.id)} className="bg-white rounded-lg px-4 py-3 flex items-center justify-between hover:shadow-sm hover:border-blue-200 transition-all border border-gray-100 cursor-pointer">
                        <div className="flex-1">
                            <div className="font-medium text-gray-900">{cost.name}</div>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="font-semibold text-gray-900">{formatEuro(cost.amount)}</div>
                            <button onClick={(e) => { e.stopPropagation(); remove(cost.id); }} className="text-gray-400 hover:text-red-500 transition-colors"><Trash2 /></button>
                        </div>
                    </div>
                )
            );

            return (
                <div className="space-y-6 pb-24">
                    <h2 className="text-2xl font-semibold text-gray-900">Fixkosten</h2>

                    <Card>
                        <div className="flex items-center gap-2 text-gray-600 mb-2">
                            <Receipt />
                            <span className="text-sm font-medium">Gesamte Fixkosten (Monat)</span>
                        </div>
                        <div className="text-3xl font-semibold text-orange-600">{formatEuro(monthlyTotal)}</div>
                    </Card>

                    {isAdding && (
                        <EditableIncomeRow item={{ id: 'new' }} update={handleAdd} remove={() => {}} isNew={true} onCancel={() => setIsAdding(false)} />
                    )}

                    {costs.length === 0 && !isAdding ? (
                        <div className="text-center py-12 text-gray-400">Noch keine Fixkosten erfasst</div>
                    ) : (
                        <div className="space-y-6">
                            {intervalOrder.map(interval => {
                                const items = grouped[interval];
                                if (items.length === 0) return null;
                                const subtotal = items.reduce((sum, c) => sum + parseFloat(c.amount), 0);
                                return (
                                    <div key={interval}>
                                        <div className="flex items-center justify-between mb-3">
                                            <h3 className="text-sm font-semibold text-gray-700 uppercase tracking-wide">{INTERVAL_LABELS[interval]}</h3>
                                            <span className="text-sm text-gray-500">{formatEuro(subtotal)}</span>
                                        </div>
                                        <div className="space-y-2">
                                            {items.map(renderCostItem)}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    <button className="fab" onClick={() => setIsAdding(true)}><PlusCircle /> Hinzufügen</button>
                </div>
            );
        }

        // ─── Inline Editable Row für Ausgaben ────────────────────────────────
        function EditableExpenseRow({ item, categories, update, remove, onAddCategory, isNew, onCancel }) {
            const [data, setData] = useState({
                description: item.description || '',
                amount: item.amount || '',
                category: item.category || categories[0] || '',
                date: item.date || new Date().toISOString().split('T')[0]
            });
            const [showNewCat, setShowNewCat] = useState(false);
            const [newCat, setNewCat] = useState('');
            const inputRef = useRef(null);

            useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

            const save = () => {
                if (!data.description || !data.amount || !data.category) return;
                update(item.id, data);
                if (isNew && onCancel) onCancel();
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); save(); }
                if (e.key === 'Escape' && isNew && onCancel) onCancel();
            };

            const addCat = () => {
                if (newCat && !categories.includes(newCat)) {
                    onAddCategory(newCat);
                    setData({...data, category: newCat});
                    setNewCat('');
                    setShowNewCat(false);
                }
            };

            return (
                <div className="bg-white rounded-lg px-4 py-3 border border-blue-200 shadow-sm space-y-3">
                    {/* Row 1: Description + Amount */}
                    <div className="flex flex-col sm:flex-row gap-2 sm:gap-3">
                        <input ref={inputRef} type="text" value={data.description} onChange={e => setData({...data, description: e.target.value})} onKeyDown={handleKeyDown}
                            placeholder="Beschreibung" className="flex-1 px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" />
                        <input type="number" step="0.01" value={data.amount} onChange={e => setData({...data, amount: e.target.value})} onKeyDown={handleKeyDown}
                            placeholder="Betrag" className="w-full sm:w-24 px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm text-right" />
                    </div>
                    {/* Row 2: Category + Date */}
                    <div className="flex flex-col sm:flex-row gap-2 sm:gap-3">
                        <div className="flex-1 flex items-center gap-2">
                            <select value={data.category} onChange={e => setData({...data, category: e.target.value})} onKeyDown={handleKeyDown}
                                className="flex-1 px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
                                {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                            </select>
                            {showNewCat ? (
                                <div className="flex items-center gap-1">
                                    <input type="text" value={newCat} onChange={e => setNewCat(e.target.value)} onKeyDown={e => e.key === 'Enter' && addCat()}
                                        placeholder="Neue..." className="w-20 sm:w-24 px-2 py-2 sm:py-1 border border-gray-200 rounded text-sm" autoFocus />
                                    <button onClick={addCat} className="text-green-600 hover:text-green-700 p-1"><Check /></button>
                                    <button onClick={() => { setShowNewCat(false); setNewCat(''); }} className="text-gray-400 hover:text-gray-600 p-1"><X /></button>
                                </div>
                            ) : (
                                <button onClick={() => setShowNewCat(true)} className="text-blue-600 hover:text-blue-700 text-xs whitespace-nowrap">+ Neu</button>
                            )}
                        </div>
                        <input type="date" value={data.date} onChange={e => setData({...data, date: e.target.value})} onKeyDown={handleKeyDown}
                            className="w-full sm:w-auto px-3 py-2 sm:px-2 sm:py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" />
                    </div>
                    {/* Row 3: Actions */}
                    <div className="flex justify-end gap-2 pt-2 border-t sm:border-0 border-gray-100 sm:pt-0 sm:hidden">
                        <button onClick={save} className="flex-1 bg-green-50 text-green-600 hover:bg-green-100 transition-colors p-2 rounded flex items-center justify-center gap-2 text-sm font-medium">
                            <Check /> Speichern
                        </button>
                        {isNew ? (
                            <button onClick={onCancel} className="flex-1 bg-gray-50 text-gray-500 hover:bg-gray-100 transition-colors p-2 rounded flex items-center justify-center gap-2 text-sm font-medium">
                                <X /> Abbrechen
                            </button>
                        ) : (
                            <button onClick={() => remove(item.id)} className="bg-gray-50 text-gray-400 hover:bg-red-50 hover:text-red-500 transition-colors p-2 rounded">
                                <Trash2 />
                            </button>
                        )}
                    </div>
                    {/* Desktop Actions (inline) */}
                    <div className="hidden sm:flex sm:justify-end sm:gap-1 sm:-mt-2">
                        <button onClick={save} className="text-green-600 hover:text-green-700 transition-colors p-1"><Check /></button>
                        {isNew ? (
                            <button onClick={onCancel} className="text-gray-400 hover:text-gray-600 transition-colors p-1"><X /></button>
                        ) : (
                            <button onClick={() => remove(item.id)} className="text-gray-400 hover:text-red-500 transition-colors p-1"><Trash2 /></button>
                        )}
                    </div>
                </div>
            );
        }

        // ─── EXPENSES ────────────────────────────────────────────────────────
        function Expenses({ expenses, categories, add, update, remove, onAddCategory, timeframe, setTimeframe, triggerAdd }) {
            const [editingId, setEditingId] = useState(null);
            const [isAdding, setIsAdding] = useState(false);

            // Reagiere auf Cmd+N
            useEffect(() => {
                if (triggerAdd > 0) setIsAdding(true);
            }, [triggerAdd]);

            const handleAdd = (id, data) => {
                add(data);
                setIsAdding(false);
            };

            const handleUpdate = (id, data) => {
                update(id, data);
                setEditingId(null);
            };

            const filtered = getExpensesInTimeframe(expenses, timeframe).sort((a, b) => new Date(b.date) - new Date(a.date));
            const tfTotal = filtered.reduce((s, e) => s + parseFloat(e.amount), 0);

            return (
                <div className="space-y-6 pb-24">
                    <div className="flex items-center justify-between">
                        <h2 className="text-2xl font-semibold text-gray-900">Ausgaben</h2>
                        <TimeframeFilter timeframe={timeframe} setTimeframe={setTimeframe} />
                    </div>

                    {/* Summen-Karte */}
                    <Card>
                        <div className="flex items-center gap-2 text-gray-600 mb-2">
                            <TrendingDown />
                            <span className="text-sm font-medium">Gesamte Ausgaben ({LABELS[timeframe]})</span>
                        </div>
                        <div className="text-3xl font-semibold text-gray-900">{formatEuro(tfTotal)}</div>
                        <div className="text-sm text-gray-500 mt-1">{filtered.length} Einträge</div>
                    </Card>

                    {/* Chart */}
                    <Card>
                        <CardTitle icon={<TrendingDown />}>Ausgaben über Zeit</CardTitle>
                        <div className="mt-4">
                            <ExpenseChart expenses={expenses} timeframe={timeframe} />
                        </div>
                    </Card>

                    {/* Liste */}
                    <div className="space-y-2">
                        {isAdding && (
                            <EditableExpenseRow item={{ id: 'new' }} categories={categories} update={handleAdd} remove={() => {}} onAddCategory={onAddCategory} isNew={true} onCancel={() => setIsAdding(false)} />
                        )}
                        {filtered.length === 0 && !isAdding ? (
                            <div className="text-center py-12 text-gray-400">Keine Ausgaben in diesem Zeitraum</div>
                        ) : filtered.map(expense => (
                            editingId === expense.id ? (
                                <EditableExpenseRow key={expense.id} item={expense} categories={categories} update={handleUpdate} remove={remove} onAddCategory={onAddCategory} isNew={false} />
                            ) : (
                                <div key={expense.id} onClick={() => setEditingId(expense.id)} className="bg-white rounded-lg px-4 py-3 flex items-center justify-between hover:shadow-sm hover:border-blue-200 transition-all border border-gray-100 cursor-pointer">
                                    <div className="flex-1">
                                        <div className="font-medium text-gray-900">{expense.description}</div>
                                        <div className="text-sm text-gray-500">{expense.category} · {formatDate(expense.date)}</div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <div className="font-semibold text-gray-900">{formatEuro(expense.amount)}</div>
                                        <button onClick={(e) => { e.stopPropagation(); remove(expense.id); }} className="text-gray-400 hover:text-red-500 transition-colors"><Trash2 /></button>
                                    </div>
                                </div>
                            )
                        ))}
                    </div>

                    <button className="fab" onClick={() => setIsAdding(true)}><PlusCircle /> Hinzufügen</button>
                </div>
            );
        }

        // ─── Inline Editable Row für Sparbeträge ─────────────────────────────────
        function EditableSavingsRow({ item, update, remove, isNew, onCancel }) {
            const [data, setData] = useState({
                name: item.name || '',
                amount: item.amount || '',
                interval: item.interval || 'monthly'
            });
            const inputRef = useRef(null);

            useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

            const save = () => {
                if (!data.name || !data.amount) return;
                update(item.id, data);
                if (isNew && onCancel) onCancel();
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); save(); }
                if (e.key === 'Escape' && isNew && onCancel) onCancel();
            };

            return (
                <div className="bg-white rounded-lg px-4 py-3 border border-blue-200 shadow-sm">
                    <div className="flex items-center gap-3">
                        <input ref={inputRef} type="text" value={data.name} onChange={e => setData({...data, name: e.target.value})} onKeyDown={handleKeyDown}
                            placeholder="Bezeichnung (z.B. ETF-Sparplan)" className="flex-1 px-2 py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" />
                        <input type="number" step="0.01" value={data.amount} onChange={e => setData({...data, amount: e.target.value})} onKeyDown={handleKeyDown}
                            placeholder="Betrag" className="w-24 px-2 py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm text-right" />
                        <select value={data.interval} onChange={e => setData({...data, interval: e.target.value})} onKeyDown={handleKeyDown}
                            className="px-2 py-1 border border-gray-200 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
                            <option value="weekly">Wöchentlich</option>
                            <option value="monthly">Monatlich</option>
                            <option value="quarterly">Quartalsweise</option>
                            <option value="yearly">Jährlich</option>
                        </select>
                        <button onClick={save} className="text-green-600 hover:text-green-700 transition-colors p-1"><Check /></button>
                        {isNew ? (
                            <button onClick={onCancel} className="text-gray-400 hover:text-gray-600 transition-colors p-1"><X /></button>
                        ) : (
                            <button onClick={() => remove(item.id)} className="text-gray-400 hover:text-red-500 transition-colors p-1"><Trash2 /></button>
                        )}
                    </div>
                </div>
            );
        }

        // ─── SAVINGS ──────────────────────────────────────────────────────────
        function Savings({ savings, add, update, remove, income, fixedCosts, expenses, triggerAdd }) {
            const [editingId, setEditingId] = useState(null);
            const [isAdding, setIsAdding] = useState(false);

            // Reagiere auf Cmd+N
            useEffect(() => {
                if (triggerAdd > 0) setIsAdding(true);
            }, [triggerAdd]);

            const handleAdd = (id, data) => {
                add(data);
                setIsAdding(false);
            };

            const handleUpdate = (id, data) => {
                update(id, data);
                setEditingId(null);
            };

            const monthlyTotal = sumForTimeframe(savings, 'monthly');
            const monthlyIncome = sumForTimeframe(income, 'monthly');
            const monthlyFixed = sumForTimeframe(fixedCosts, 'monthly');
            const monthlyExpenses = getExpensesInTimeframe(expenses, 'monthly').reduce((s, e) => s + parseFloat(e.amount), 0);
            const available = monthlyIncome - monthlyFixed - monthlyExpenses;
            const savingsRate = monthlyIncome > 0 ? (monthlyTotal / monthlyIncome) * 100 : 0;

                        <Card>

                                <Wallet />
                                <span className="text-sm font-medium">Noch verfügbar</span>
                            </div>

                            <div className="text-sm text-gray-500 mt-1">nach Sparen</div>

                    </div>

                    {/* Empfehlung */}
                    {savingsRate < 10 && monthlyIncome > 0 && (

                                                <div className="font-semibold text-blue-600">{formatEuro(item.amount)}</div>
                                                {item.interval !== 'monthly' && <div className="text-xs text-gray-500">{formatEuro(monthlyAmount)}/Monat</div>}

        // ─── IMPORT ───────────────────────────────────────────────────────────
        // Erkennt ob eine Transaktion eine Umbuchung ist
        function isUmbuchung(description) {
            const desc = description.toLowerCase();
            const umbuchungPatterns = [
                'umbuchung',
                'kapital-konto',
                'not-konto',
                'sparen',
                'einkommensverteiler',
                'eigene konten',
                'intern'
            ];
            // Prüfe auch ob es eine Überweisung an sich selbst ist
            const selfTransferPatterns = [
                'julius oberem', // Name des Kontoinhabers
            ];

            return umbuchungPatterns.some(p => desc.includes(p)) ||
                   (desc.includes('überweisung') && selfTransferPatterns.some(p => desc.includes(p))) ||
                   (desc.includes('echtzeitüberweisung') && selfTransferPatterns.some(p => desc.includes(p)));
        }

        // ─── TRANSACTIONS PAGE ──────────────────────────────────────────────────
        function Transactions({ transactions, remove }) {

                    filtered = filtered.filter(t => t.amount < 0);
                }

                // Filter by search term
                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    filtered = filtered.filter(t =>
                        t.description?.toLowerCase().includes(term) ||
                        t.name?.toLowerCase().includes(term) ||
                        t.category?.toLowerCase().includes(term)
                    );

                filtered.sort((a, b) => {
                    let comparison = 0;
                    if (sortBy === 'date') {
                        comparison = new Date(a.date || 0) - new Date(b.date || 0);
                    } else if (sortBy === 'amount') {
                        comparison = Math.abs(a.amount) - Math.abs(b.amount);
                    } else if (sortBy === 'name') {
                        comparison = (a.description || a.name || '').localeCompare(b.description || b.name || '');
                    }
                    return sortOrder === 'desc' ? -comparison : comparison;
                });

                return filtered;
            }, [transactions, filter, searchTerm, sortBy, sortOrder]);

            const totalIncome = transactions.filter(t => t.amount > 0).reduce((sum, t) => sum + t.amount, 0);
            const totalExpenses = transactions.filter(t => t.amount < 0).reduce((sum, t) => sum + Math.abs(t.amount), 0);

            return (
                <div className="space-y-6">
                    <Card>
                        <div className="flex items-start gap-3">
                            <div className="text-blue-600"><ListIcon /></div>

                                <h3 className="font-medium text-gray-900">Alle importierten Transaktionen</h3>
                                <p className="text-sm text-gray-600 mt-1">

                                </p>
                            </div>
                        </div>
                    </Card>

                    {/* Stats */}
                    <div className="grid grid-cols-3 gap-4">
                        <Card>
                            <div className="text-center">
                                <div className="text-2xl font-bold text-gray-900">{transactions.length}</div>
                                <div className="text-sm text-gray-500">Transaktionen</div>
                            </div>
                        </Card>
                        <Card>
                            <div className="text-center">
                                <div className="text-2xl font-bold text-green-600">{formatEuro(totalIncome)}</div>
                                <div className="text-sm text-gray-500">Einnahmen</div>
                            </div>
                        </Card>
                        <Card>
                            <div className="text-center">
                                <div className="text-2xl font-bold text-red-600">{formatEuro(totalExpenses)}</div>
                                <div className="text-sm text-gray-500">Ausgaben</div>
                            </div>
                        </Card>
                    </div>

                    {/* Filters */}
                    <Card>
                        <div className="flex flex-col sm:flex-row gap-4">
                            {/* Search */}
                            <div className="flex-1">
                                <input
                                    type="text"
                                    placeholder="Suchen..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                />
                            </div>

                            {/* Type Filter */}
                            <div className="flex gap-2">
                                <button
                                    onClick={() => setFilter('all')}
                                    className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${
                                        filter === 'all' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                    }`}
                                >
                                    Alle
                                </button>
                                <button
                                    onClick={() => setFilter('income')}
                                    className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${
                                        filter === 'income' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                    }`}
                                >
                                    Einnahmen
                                </button>
                                <button
                                    onClick={() => setFilter('expense')}
                                    className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${
                                        filter === 'expense' ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                    }`}
                                >
                                    Ausgaben
                                </button>
                            </div>

                            {/* Sort */}
                            <div className="flex gap-2">
                                <select
                                    value={sortBy}
                                    onChange={(e) => setSortBy(e.target.value)}
                                    className="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                                >
                                    <option value="date">Datum</option>
                                    <option value="amount">Betrag</option>
                                    <option value="name">Name</option>
                                </select>
                                <button
                                    onClick={() => setSortOrder(sortOrder === 'desc' ? 'asc' : 'desc')}
                                    className="px-3 py-2 bg-gray-100 rounded-lg text-sm text-gray-600 hover:bg-gray-200"
                                >
                                    {sortOrder === 'desc' ? '↓' : '↑'}
                                </button>
                            </div>
                        </div>
                    </Card>

                    {/* Transaction List */}
                    {filteredTransactions.length > 0 ? (
                        <Card>
                            <div className="space-y-2 max-h-[600px] overflow-y-auto">
                                {filteredTransactions.map((transaction) => (
                                    <div
                                        key={transaction.id}
                                        className="p-4 rounded-lg border border-gray-200 hover:border-gray-300 transition-colors"
                                    >
                                        <div className="flex items-center gap-4">
                                            <div className={`w-10 h-10 rounded-full flex items-center justify-center ${
                                                transaction.amount > 0 ? 'bg-green-100' : 'bg-red-100'
                                            }`}>
                                                {transaction.amount > 0 ? (

                                                    <TrendingDown className="text-red-600" />

                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-2 flex-wrap">

                                                    {transaction.isUmbuchung && (
                                                        <span className="text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">
                                                            Umbuchung
                                                        </span>
                                                    )}
                                                    {transaction.isContract && (
                                                        <span className="text-xs px-2 py-0.5 rounded-full bg-purple-100 text-purple-700">
                                                            Vertrag
                                                        </span>
                                                    )}
                                                    {transaction.isIncome && (
                                                        <span className="text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700">
                                                            Einkommen
                                                        </span>
                                                    )}
                                                </div>
                                                <div className="font-medium text-gray-900 mt-1 truncate">
                                                    {transaction.name || transaction.description}
                                                </div>
                                                {transaction.description && transaction.name && (
                                                    <div className="text-xs text-gray-500 mt-1 truncate">
                                                        {transaction.description}
                                                    </div>
                                                )}
                                            </div>
                                            <div className="text-right flex items-center gap-3">
                                                <div className={`font-semibold ${
                                                    transaction.amount > 0 ? 'text-green-600' : 'text-red-600'
                                                }`}>
                                                    {transaction.amount > 0 ? '+' : ''}{formatEuro(transaction.amount)}
                                                </div>
                                                <button
                                                    onClick={() => remove(transaction.id)}
                                                    className="p-1 text-gray-400 hover:text-red-500 transition-colors"
                                                    title="Löschen"

                        </Card>
                    ) : (
                        <Card>
                            <div className="text-center py-12 text-gray-500">
                                <ListIcon className="mx-auto mb-3 text-gray-300" />

                                <div className="text-sm text-gray-400 mt-1">
                                    {searchTerm || filter !== 'all'
                                        ? 'Keine Transaktionen entsprechen deinen Filterkriterien.'

                                    }
                                </div>
                            </div>
                        </Card>
                    )}
                </div>
            );
        }

        function Import({ expenses, income, categories, addExpenses, addFixedCosts, addIncomes, addSavings, addTransactions, onAddCategory }) {
            const [dragOver, setDragOver] = useState(false);
            const [parseResult, setParseResult] = useState(null);
            const [selectedTransactions, setSelectedTransactions] = useState(new Set());
            const [selectedContracts, setSelectedContracts] = useState(new Set());
            const [selectedIncomeSources, setSelectedIncomeSources] = useState(new Set());
            const [selectedSavingsPlans, setSelectedSavingsPlans] = useState(new Set());
            const [categoryMapping, setCategoryMapping] = useState({});
            const [importing, setImporting] = useState(false);
            const [importComplete, setImportComplete] = useState(false);
            const [parsing, setParsing] = useState(false);
            const [hideUmbuchungen, setHideUmbuchungen] = useState(true);
            const [activeTab, setActiveTab] = useState('expenses'); // 'expenses', 'contracts', or 'income'
            const fileInputRef = useRef(null);

            const handleFile = async (file) => {
                if (!file) return;

                setParsing(true);
                setParseResult(null);

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await parseC24PDF(arrayBuffer);

                    // Mark Umbuchungen, detect contracts and income
                    if (result.transactions) {
                        result.transactions.forEach(t => {
                            t.isUmbuchung = isUmbuchung(t.description);
                            if (t.type === 'expense') {
                                t.contract = detectContract(t.description);
                            } else if (t.type === 'income') {
                                t.incomeSource = detectIncome(t.description, t.amount);
                            }
                        });

                        // Extract unique contracts (by name) - separate savings plans from regular contracts
                        const contractMap = new Map();
                        const savingsPlanMap = new Map();
                        result.transactions.forEach((t, idx) => {
                            if (t.contract && t.type === 'expense' && !t.isUmbuchung) {
                                const key = t.contract.name;
                                if (t.contract.isSavingsPlan) {
                                    // Sparplan -> separate list
                                    if (!savingsPlanMap.has(key)) {
                                        savingsPlanMap.set(key, {
                                            ...t.contract,
                                            amount: t.amount,
                                            transactionIdx: idx,
                                            date: t.date,
                                            originalDescription: t.description
                                        });
                                    }
                                } else {
                                    // Regular contract -> fixedCosts
                                    if (!contractMap.has(key)) {
                                        contractMap.set(key, {
                                            ...t.contract,
                                            amount: t.amount,
                                            transactionIdx: idx,
                                            date: t.date,
                                            originalDescription: t.description
                                        });
                                    }
                                }
                            }
                        });
                        result.contracts = Array.from(contractMap.values());
                        result.savingsPlans = Array.from(savingsPlanMap.values());

                        // Extract unique income sources (by name)
                        const incomeMap = new Map();
                        result.transactions.forEach((t, idx) => {
                            if (t.incomeSource && t.type === 'income' && !t.isUmbuchung) {
                                const key = t.incomeSource.name + '_' + t.amount; // Unique by name and amount
                                if (!incomeMap.has(key)) {
                                    incomeMap.set(key, {
                                        ...t.incomeSource,
                                        amount: t.amount,
                                        transactionIdx: idx,
                                        date: t.date,
                                        originalDescription: t.description
                                    });
                                }
                            }
                        });
                        result.incomeSources = Array.from(incomeMap.values());
                    }

                    setParseResult(result);

                    // Pre-select all non-Umbuchung, non-contract, non-income transactions for expenses
                    if (result.transactions && result.transactions.length > 0) {
                        const selected = new Set();
                        result.transactions.forEach((t, i) => {
                            if (!t.isUmbuchung && !t.contract && !t.incomeSource && t.type === 'expense') {
                                selected.add(i);
                            }
                        });
                        setSelectedTransactions(selected);

                        // Pre-select all detected contracts
                        if (result.contracts) {
                            setSelectedContracts(new Set(result.contracts.map((_, i) => i)));
                        }

                        // Pre-select all detected income sources
                        if (result.incomeSources) {
                            setSelectedIncomeSources(new Set(result.incomeSources.map((_, i) => i)));
                        }

                        // Auto-detect categories
                        const mapping = {};
                        result.transactions.forEach((t, i) => {
                            if (!t.category) {
                                const detected = detectCategory(t.description, categories);
                                if (detected) {
                                    mapping[i] = detected;
                                }
                            } else {
                                mapping[i] = t.category;
                            }
                        });
                        setCategoryMapping(mapping);
                    }
                } catch (error) {
                    setParseResult({ error: 'Fehler beim Lesen der PDF: ' + error.message });
                } finally {
                    setParsing(false);
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setDragOver(false);
                const file = e.dataTransfer.files[0];
                if (file && (file.name.endsWith('.pdf') || file.type === 'application/pdf')) {
                    handleFile(file);
                }
            };

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (file) handleFile(file);
            };

            const toggleTransaction = (idx) => {
                const newSelected = new Set(selectedTransactions);
                if (newSelected.has(idx)) {
                    newSelected.delete(idx);
                } else {
                    newSelected.add(idx);
                }
                setSelectedTransactions(newSelected);
            };

            const selectAll = () => {
                if (parseResult) {
                    const selected = new Set();
                    parseResult.transactions.forEach((t, i) => {
                        if (!hideUmbuchungen || !t.isUmbuchung) {
                            selected.add(i);
                        }
                    });
                    setSelectedTransactions(selected);
                }
            };

            const selectNone = () => {
                setSelectedTransactions(new Set());
            };

            const toggleHideUmbuchungen = () => {
                const newHide = !hideUmbuchungen;
                setHideUmbuchungen(newHide);

                // Update selection based on new filter
                if (newHide && parseResult) {
                    // Remove Umbuchungen from selection
                    const newSelected = new Set(selectedTransactions);
                    parseResult.transactions.forEach((t, i) => {
                        if (t.isUmbuchung) {

                parseResult.transactions.forEach((t, idx) => {

                    transactionsToAdd.push({
                        description: t.description,
                        name: t.name || t.description,
                        amount: t.type === 'expense' ? -Math.abs(t.amount) : Math.abs(t.amount),
                        category: categoryMapping[idx] || t.category || 'Sonstiges',

                        isUmbuchung: t.isUmbuchung,
                        isContract: t.isContract,
                        isIncome: t.isIncome

                if (expensesToAdd.length > 0) {

                                    <pre className="mt-2 text-xs text-gray-600 bg-white p-3 rounded border overflow-x-auto max-h-48 overflow-y-auto whitespace-pre-wrap">
                                        {parseResult.rawText}

                                </details>

                            <button

                                Andere Datei versuchen

                        </div>

                    {parseResult?.errors && parseResult.transactions.length > 0 && (

                                                                    <span className="text-xs text-gray-500">{formatDate(t.date)}</span>

                                                                {t.type === 'expense' && selectedTransactions.has(idx) && (

                                                    </div>

                                                    Diese Transaktionen wurden als wiederkehrende Zahlungen erkannt.
                                                    Du kannst sie als Fixkosten importieren, um sie in der Analyse zu berücksichtigen.
                                                </div>
                                            </div>

                                    </Card>

                                    {parseResult.contracts?.length > 0 ? (
                                        <>
                                            <div className="flex items-center justify-between">
                                                <div className="text-sm text-gray-600">
                                                    {selectedContracts.size} von {parseResult.contracts.length} ausgewählt
                                                </div>
                                                <div className="flex gap-2">
                                                    <button
                                                        onClick={() => setSelectedContracts(new Set(parseResult.contracts.map((_, i) => i)))}
                                                        className="text-sm text-purple-600 hover:text-purple-800"
                                                    >Alle</button>
                                                    <span className="text-gray-300">|</span>
                                                    <button
                                                        onClick={() => setSelectedContracts(new Set())}
                                                        className="text-sm text-gray-600 hover:text-gray-800"

                                                </div>

                                                        <div
                                                            key={idx}

                                                                const newSelected = new Set(selectedContracts);

                                                                    newSelected.delete(idx);

                                                                    newSelected.add(idx);
