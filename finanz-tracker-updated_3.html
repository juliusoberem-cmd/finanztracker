<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanz Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ─── Icons ───────────────────────────────────────────────────────────
        const PlusCircle = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>);
        const TrendingDown = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>);
        const Receipt = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17V7"/></svg>);
        const Trash2 = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>);
        const Check = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>);
        const X = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>);
        const Wallet = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>);
        const AlertCircle = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>);
        const Pencil = () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>);

        // ─── Helpers ─────────────────────────────────────────────────────────
        const LABELS = { weekly: 'Woche', monthly: 'Monat', yearly: 'Jahr' };
        const INTERVAL_LABELS = { weekly: 'Wöchentlich', monthly: 'Monatlich', yearly: 'Jährlich' };

        function convertToTimeframe(amount, fromInterval, toTimeframe) {
            const a = parseFloat(amount);
            if (toTimeframe === 'weekly') {
                if (fromInterval === 'weekly') return a;
                if (fromInterval === 'monthly') return a / 4.33;
                if (fromInterval === 'yearly') return a / 52;
            } else if (toTimeframe === 'monthly') {
                if (fromInterval === 'monthly') return a;
                if (fromInterval === 'yearly') return a / 12;
                if (fromInterval === 'weekly') return a * 4.33;
            } else if (toTimeframe === 'yearly') {
                if (fromInterval === 'yearly') return a;
                if (fromInterval === 'monthly') return a * 12;
                if (fromInterval === 'weekly') return a * 52;
            }
            return a;
        }

        function sumForTimeframe(items, timeframe) {
            return items.reduce((sum, item) => sum + convertToTimeframe(item.amount, item.interval, timeframe), 0);
        }

        function getExpensesInTimeframe(expenses, timeframe) {
            const now = new Date();
            return expenses.filter(e => {
                const diff = (now - new Date(e.date)) / (1000 * 60 * 60 * 24);
                if (timeframe === 'weekly') return diff <= 7;
                if (timeframe === 'monthly') return diff <= 30;
                if (timeframe === 'yearly') return diff <= 365;
                return true;
            });
        }

        function formatEuro(amount) {
            return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(amount);
        }

        function formatDate(d) {
            return new Date(d).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        // ─── localStorage bridge ─────────────────────────────────────────────
        const storage = {
            get: async (key) => { const v = localStorage.getItem(key); if (!v) throw new Error(); return { value: v }; },
            set: async (key, value) => { localStorage.setItem(key, value); }
        };

        // ─── Shared sub-components ───────────────────────────────────────────
        function TimeframeFilter({ timeframe, setTimeframe }) {
            return (
                <div className="flex gap-2">
                    {['weekly', 'monthly', 'yearly'].map(tf => (
                        <button key={tf} onClick={() => setTimeframe(tf)}
                            className={`px-3 py-1.5 rounded-lg text-sm transition-colors ${timeframe === tf ? 'bg-gray-900 text-white' : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'}`}>
                            {LABELS[tf]}
                        </button>
                    ))}
                </div>
            );
        }

        function Card({ children }) {
            return <div className="bg-white rounded-xl p-6 border border-gray-100 shadow-sm">{children}</div>;
        }

        function CardTitle({ icon, children }) {
            return (
                <div className="flex items-center gap-2 text-gray-900 font-medium">
                    {icon && <span className="text-gray-400">{icon}</span>}
                    {children}
                </div>
            );
        }

        function Input({ label, ...props }) {
            return (
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">{label}</label>
                    <input {...props} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
                </div>
            );
        }

        function IntervalSelect({ value, onChange }) {
            return (
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">Intervall</label>
                    <select value={value} onChange={onChange} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="weekly">Wöchentlich</option>
                        <option value="monthly">Monatlich</option>
                        <option value="yearly">Jährlich</option>
                    </select>
                </div>
            );
        }

        // ─── ROOT ────────────────────────────────────────────────────────────
        function FinanceTracker() {
            const [view, setView] = useState('dashboard');
            const [fixedCosts, setFixedCosts] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [income, setIncome] = useState([]);
            const [categories, setCategories] = useState(['Lebensmittel', 'Transport', 'Unterhaltung']);
            const [timeframe, setTimeframe] = useState('monthly');
            const [loading, setLoading] = useState(true);

            useEffect(() => { loadData(); }, []);

            const loadData = async () => {
                try {
                    const [f, e, c, i] = await Promise.all([
                        storage.get('fixed-costs').catch(() => null),
                        storage.get('expenses').catch(() => null),
                        storage.get('categories').catch(() => null),
                        storage.get('income').catch(() => null)
                    ]);
                    if (f?.value) setFixedCosts(JSON.parse(f.value));
                    if (e?.value) setExpenses(JSON.parse(e.value));
                    if (c?.value) setCategories(JSON.parse(c.value));
                    if (i?.value) setIncome(JSON.parse(i.value));
                } catch (err) { console.error(err); }
                finally { setLoading(false); }
            };

            const save = async (key, data) => { try { await storage.set(key, JSON.stringify(data)); } catch(e) {} };

            // ── CRUD helpers ──
            const crud = (key, list, setList) => ({
                add: (item) => { const u = [...list, { ...item, id: Date.now() }]; setList(u); save(key, u); },
                update: (id, item) => { const u = list.map(i => i.id === id ? { ...item, id } : i); setList(u); save(key, u); },
                remove: (id) => { const u = list.filter(i => i.id !== id); setList(u); save(key, u); }
            });

            const incomeCrud = crud('income', income, setIncome);
            const fixedCrud = crud('fixed-costs', fixedCosts, setFixedCosts);
            const expenseCrud = crud('expenses', expenses, setExpenses);

            const addCategory = (cat) => { const u = [...categories, cat]; setCategories(u); save('categories', u); };

            if (loading) return <div className="min-h-screen bg-gray-50 flex items-center justify-center"><div className="text-gray-400">Laden...</div></div>;

            return (
                <div className="min-h-screen bg-gray-50">
                    <nav className="bg-white border-b border-gray-200">
                        <div className="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
                            <h1 className="text-xl font-medium text-gray-900">Finanzen</h1>
                            <div className="flex gap-1">
                                {[['dashboard','Übersicht'],['income','Einkommen'],['fixed','Fixkosten'],['expenses','Ausgaben']].map(([k,l]) => (
                                    <button key={k} onClick={() => setView(k)}
                                        className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${view === k ? 'bg-blue-50 text-blue-600' : 'text-gray-600 hover:bg-gray-50'}`}>{l}</button>
                                ))}
                            </div>
                        </div>
                    </nav>
                    <main className="max-w-5xl mx-auto px-6 py-8">
                        {view === 'dashboard'  && <Dashboard  fixedCosts={fixedCosts} expenses={expenses} income={income} timeframe={timeframe} setTimeframe={setTimeframe} />}
                        {view === 'income'     && <Income     income={income}     {...incomeCrud}   timeframe={timeframe} setTimeframe={setTimeframe} />}
                        {view === 'fixed'      && <FixedCosts costs={fixedCosts}  {...fixedCrud}    timeframe={timeframe} setTimeframe={setTimeframe} />}
                        {view === 'expenses'   && <Expenses   expenses={expenses} categories={categories} {...expenseCrud} onAddCategory={addCategory} timeframe={timeframe} setTimeframe={setTimeframe} />}
                    </main>
                </div>
            );
        }

        // ─── DASHBOARD ───────────────────────────────────────────────────────
        function Dashboard({ fixedCosts, expenses, income, timeframe, setTimeframe }) {
            const tfIncome = sumForTimeframe(income, timeframe);
            const tfFixed  = sumForTimeframe(fixedCosts, timeframe);
            const tfExpenses = getExpensesInTimeframe(expenses, timeframe).reduce((s, e) => s + parseFloat(e.amount), 0);
            const available = tfIncome - tfFixed;
            const remaining = available - tfExpenses;
            const usagePct  = available > 0 ? (tfExpenses / available) * 100 : 0;

            // group expenses by category
            const byCategory = {};
            getExpensesInTimeframe(expenses, timeframe).forEach(e => {
                byCategory[e.category] = (byCategory[e.category] || 0) + parseFloat(e.amount);
            });

            return (
                <div className="space-y-8">
                    <div className="flex items-center justify-between">
                        <h2 className="text-2xl font-semibold text-gray-900">Übersicht</h2>
                        <TimeframeFilter timeframe={timeframe} setTimeframe={setTimeframe} />
                    </div>

                    {/* Budget card */}
                    <Card>
                        <div className="space-y-4">
                            <div className="flex items-center justify-between">
                                <div>
                                    <div className="text-sm text-gray-500 mb-1">Frei verfügbar ({LABELS[timeframe]})</div>
                                    <div className="text-3xl font-semibold text-gray-900">{formatEuro(remaining)}</div>
                                </div>
                                {remaining < 0 && (
                                    <div className="flex items-center gap-2 px-3 py-1.5 bg-red-50 text-red-600 rounded-lg text-sm">
                                        <AlertCircle /> Überzogen
                                    </div>
                                )}
                            </div>
                            <div className="space-y-2">
                                <div className="flex justify-between text-sm">
                                    <span className="text-gray-600">Verbraucht</span>
                                    <span className="font-medium text-gray-900">{usagePct.toFixed(0)}%</span>
                                </div>
                                <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                                    <div className={`h-full transition-all ${usagePct > 100 ? 'bg-red-500' : usagePct > 80 ? 'bg-orange-500' : 'bg-green-500'}`}
                                        style={{ width: `${Math.min(usagePct, 100)}%` }} />
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-4 pt-2 border-t border-gray-100">
                                <div><div className="text-xs text-gray-500 mb-1">Einkommen</div><div className="font-medium text-gray-900">{formatEuro(tfIncome)}</div></div>
                                <div><div className="text-xs text-gray-500 mb-1">Fixkosten</div><div className="font-medium text-gray-900">-{formatEuro(tfFixed)}</div></div>
                                <div><div className="text-xs text-gray-500 mb-1">Ausgaben</div><div className="font-medium text-gray-900">-{formatEuro(tfExpenses)}</div></div>
                            </div>
                        </div>
                    </Card>

                    <div className="grid md:grid-cols-2 gap-6">
                        <Card>
                            <CardTitle icon={<Receipt />}>Fixkosten ({LABELS[timeframe]})</CardTitle>
                            <div className="mt-4">
                                <div className="text-3xl font-semibold text-gray-900">{formatEuro(tfFixed)}</div>
                                <div className="text-sm text-gray-500 mt-1">{fixedCosts.length} Positionen</div>
                            </div>
                        </Card>
                        <Card>
                            <CardTitle icon={<TrendingDown />}>Ausgaben ({LABELS[timeframe]})</CardTitle>
                            <div className="mt-4">
                                <div className="text-3xl font-semibold text-gray-900">{formatEuro(tfExpenses)}</div>
                                <div className="text-sm text-gray-500 mt-1">{getExpensesInTimeframe(expenses, timeframe).length} Ausgaben</div>
                            </div>
                        </Card>
                    </div>

                    {Object.keys(byCategory).length > 0 && (
                        <Card>
                            <CardTitle>Nach Kategorie</CardTitle>
                            <div className="space-y-3 mt-4">
                                {Object.entries(byCategory).sort(([,a],[,b]) => b - a).map(([cat, amt]) => {
                                    const pct = available > 0 ? (amt / available) * 100 : 0;
                                    return (
                                        <div key={cat} className="space-y-1">
                                            <div className="flex justify-between items-center">
                                                <span className="text-gray-700">{cat}</span>
                                                <div className="flex items-center gap-3">
                                                    <span className="text-sm text-gray-500">{pct.toFixed(0)}%</span>
                                                    <span className="font-medium text-gray-900 w-20 text-right">{formatEuro(amt)}</span>
                                                </div>
                                            </div>
                                            <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                                <div className="h-full bg-blue-500" style={{ width: `${Math.min(pct, 100)}%` }} />
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </Card>
                    )}
                </div>
            );
        }

        // ─── INCOME ──────────────────────────────────────────────────────────
        function Income({ income, add, update, remove, timeframe, setTimeframe }) {
            const [showForm, setShowForm] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const emptyForm = { name: '', amount: '', interval: 'monthly' };
            const [formData, setFormData] = useState(emptyForm);

            const openAdd  = () => { setFormData(emptyForm); setEditingId(null); setShowForm(true); };
            const openEdit = (item) => { setFormData({ name: item.name, amount: item.amount, interval: item.interval }); setEditingId(item.id); setShowForm(true); };
            const cancel   = () => { setShowForm(false); setEditingId(null); };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.name || !formData.amount) return;
                if (editingId) update(editingId, formData);
                else add(formData);
                cancel();
            };

            const tfTotal = sumForTimeframe(income, timeframe);

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <h2 className="text-2xl font-semibold text-gray-900">Einkommen</h2>
                        <div className="flex items-center gap-3">
                            <TimeframeFilter timeframe={timeframe} setTimeframe={setTimeframe} />
                            <button onClick={openAdd} className="flex items-center gap-2 px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">
                                <PlusCircle /> Hinzufügen
                            </button>
                        </div>
                    </div>

                    {showForm && (
                        <Card>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <Input label="Bezeichnung" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder="z.B. Gehalt, Nebenjob" />
                                <Input label="Betrag (€)" type="number" step="0.01" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} placeholder="0.00" />
                                <IntervalSelect value={formData.interval} onChange={e => setFormData({...formData, interval: e.target.value})} />
                                <div className="flex gap-2">
                                    <button type="submit" className="flex-1 px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">{editingId ? 'Aktualisieren' : 'Speichern'}</button>
                                    <button type="button" onClick={cancel} className="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Abbrechen</button>
                                </div>
                            </form>
                        </Card>
                    )}

                    <Card>
                        <div className="flex items-center gap-2 text-gray-600 mb-2">
                            <Wallet />
                            <span className="text-sm font-medium">Gesamteinkommen ({LABELS[timeframe]})</span>
                        </div>
                        <div className="text-3xl font-semibold text-gray-900">{formatEuro(tfTotal)}</div>
                    </Card>

                    <div className="space-y-2">
                        {income.length === 0 ? (
                            <div className="text-center py-12 text-gray-400">Noch kein Einkommen erfasst</div>
                        ) : income.map(item => (
                            <div key={item.id} className="bg-white rounded-lg px-4 py-3 flex items-center justify-between hover:shadow-sm transition-shadow border border-gray-100">
                                <div className="flex-1">
                                    <div className="font-medium text-gray-900">{item.name}</div>
                                    <div className="text-sm text-gray-500">{INTERVAL_LABELS[item.interval]}</div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="font-semibold text-green-600">{formatEuro(item.amount)}</div>
                                    <button onClick={() => openEdit(item)} className="text-gray-400 hover:text-blue-500 transition-colors"><Pencil /></button>
                                    <button onClick={() => remove(item.id)} className="text-gray-400 hover:text-red-500 transition-colors"><Trash2 /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ─── FIXED COSTS ─────────────────────────────────────────────────────
        function FixedCosts({ costs, add, update, remove, timeframe, setTimeframe }) {
            const [showForm, setShowForm] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const emptyForm = { name: '', amount: '', interval: 'monthly' };
            const [formData, setFormData] = useState(emptyForm);

            const openAdd  = () => { setFormData(emptyForm); setEditingId(null); setShowForm(true); };
            const openEdit = (item) => { setFormData({ name: item.name, amount: item.amount, interval: item.interval }); setEditingId(item.id); setShowForm(true); };
            const cancel   = () => { setShowForm(false); setEditingId(null); };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.name || !formData.amount) return;
                if (editingId) update(editingId, formData);
                else add(formData);
                cancel();
            };

            const tfTotal = sumForTimeframe(costs, timeframe);

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <h2 className="text-2xl font-semibold text-gray-900">Fixkosten</h2>
                        <div className="flex items-center gap-3">
                            <TimeframeFilter timeframe={timeframe} setTimeframe={setTimeframe} />
                            <button onClick={openAdd} className="flex items-center gap-2 px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">
                                <PlusCircle /> Hinzufügen
                            </button>
                        </div>
                    </div>

                    {showForm && (
                        <Card>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <Input label="Name" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder="z.B. Miete, Netflix" />
                                <Input label="Betrag (€)" type="number" step="0.01" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} placeholder="0.00" />
                                <IntervalSelect value={formData.interval} onChange={e => setFormData({...formData, interval: e.target.value})} />
                                <div className="flex gap-2">
                                    <button type="submit" className="flex-1 px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">{editingId ? 'Aktualisieren' : 'Speichern'}</button>
                                    <button type="button" onClick={cancel} className="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Abbrechen</button>
                                </div>
                            </form>
                        </Card>
                    )}

                    <Card>
                        <div className="flex items-center gap-2 text-gray-600 mb-2">
                            <Receipt />
                            <span className="text-sm font-medium">Gesamte Fixkosten ({LABELS[timeframe]})</span>
                        </div>
                        <div className="text-3xl font-semibold text-gray-900">{formatEuro(tfTotal)}</div>
                    </Card>

                    <div className="space-y-2">
                        {costs.length === 0 ? (
                            <div className="text-center py-12 text-gray-400">Noch keine Fixkosten erfasst</div>
                        ) : costs.map(cost => (
                            <div key={cost.id} className="bg-white rounded-lg px-4 py-3 flex items-center justify-between hover:shadow-sm transition-shadow border border-gray-100">
                                <div className="flex-1">
                                    <div className="font-medium text-gray-900">{cost.name}</div>
                                    <div className="text-sm text-gray-500">{INTERVAL_LABELS[cost.interval]}</div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="font-semibold text-gray-900">{formatEuro(cost.amount)}</div>
                                    <button onClick={() => openEdit(cost)} className="text-gray-400 hover:text-blue-500 transition-colors"><Pencil /></button>
                                    <button onClick={() => remove(cost.id)} className="text-gray-400 hover:text-red-500 transition-colors"><Trash2 /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ─── EXPENSES ────────────────────────────────────────────────────────
        function Expenses({ expenses, categories, add, update, remove, onAddCategory, timeframe, setTimeframe }) {
            const [showForm, setShowForm] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [showCategoryForm, setShowCategoryForm] = useState(false);
            const [newCategory, setNewCategory] = useState('');
            const emptyForm = { description: '', amount: '', category: categories[0] || '', date: new Date().toISOString().split('T')[0] };
            const [formData, setFormData] = useState(emptyForm);

            const openAdd  = () => { setFormData(emptyForm); setEditingId(null); setShowForm(true); };
            const openEdit = (item) => { setFormData({ description: item.description, amount: item.amount, category: item.category, date: item.date }); setEditingId(item.id); setShowForm(true); };
            const cancel   = () => { setShowForm(false); setEditingId(null); };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.description || !formData.amount || !formData.category) return;
                if (editingId) update(editingId, formData);
                else add(formData);
                cancel();
            };

            const handleAddCategory = (e) => {
                e.preventDefault();
                if (newCategory && !categories.includes(newCategory)) {
                    onAddCategory(newCategory);
                    setFormData({...formData, category: newCategory});
                    setNewCategory('');
                    setShowCategoryForm(false);
                }
            };

            const filtered = getExpensesInTimeframe(expenses, timeframe).sort((a, b) => new Date(b.date) - new Date(a.date));
            const tfTotal = filtered.reduce((s, e) => s + parseFloat(e.amount), 0);

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <h2 className="text-2xl font-semibold text-gray-900">Ausgaben</h2>
                        <div className="flex items-center gap-3">
                            <TimeframeFilter timeframe={timeframe} setTimeframe={setTimeframe} />
                            <button onClick={openAdd} className="flex items-center gap-2 px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">
                                <PlusCircle /> Hinzufügen
                            </button>
                        </div>
                    </div>

                    {showForm && (
                        <Card>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <Input label="Beschreibung" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} placeholder="z.B. Einkauf Rewe" />
                                <Input label="Betrag (€)" type="number" step="0.01" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} placeholder="0.00" />
                                <div>
                                    <div className="flex items-center justify-between mb-2">
                                        <label className="block text-sm font-medium text-gray-700">Kategorie</label>
                                        <button type="button" onClick={() => setShowCategoryForm(!showCategoryForm)} className="text-sm text-blue-600 hover:text-blue-700">+ Neue Kategorie</button>
                                    </div>
                                    {showCategoryForm && (
                                        <div className="mb-3 flex gap-2">
                                            <input type="text" value={newCategory} onChange={e => setNewCategory(e.target.value)} placeholder="Kategoriename"
                                                className="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
                                            <button type="button" onClick={handleAddCategory} className="px-3 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800"><Check /></button>
                                            <button type="button" onClick={() => { setShowCategoryForm(false); setNewCategory(''); }} className="px-3 py-2 border border-gray-300 rounded-lg hover:bg-gray-50"><X /></button>
                                        </div>
                                    )}
                                    <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                    </select>
                                </div>
                                <Input label="Datum" type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} />
                                <div className="flex gap-2">
                                    <button type="submit" className="flex-1 px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">{editingId ? 'Aktualisieren' : 'Speichern'}</button>
                                    <button type="button" onClick={cancel} className="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">Abbrechen</button>
                                </div>
                            </form>
                        </Card>
                    )}

                    <Card>
                        <div className="flex items-center gap-2 text-gray-600 mb-2">
                            <TrendingDown />
                            <span className="text-sm font-medium">Gesamte Ausgaben ({LABELS[timeframe]})</span>
                        </div>
                        <div className="text-3xl font-semibold text-gray-900">{formatEuro(tfTotal)}</div>
                        <div className="text-sm text-gray-500 mt-1">{filtered.length} Einträge</div>
                    </Card>

                    <div className="space-y-2">
                        {filtered.length === 0 ? (
                            <div className="text-center py-12 text-gray-400">Keine Ausgaben in diesem Zeitraum</div>
                        ) : filtered.map(expense => (
                            <div key={expense.id} className="bg-white rounded-lg px-4 py-3 flex items-center justify-between hover:shadow-sm transition-shadow border border-gray-100">
                                <div className="flex-1">
                                    <div className="font-medium text-gray-900">{expense.description}</div>
                                    <div className="text-sm text-gray-500">{expense.category} · {formatDate(expense.date)}</div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="font-semibold text-gray-900">{formatEuro(expense.amount)}</div>
                                    <button onClick={() => openEdit(expense)} className="text-gray-400 hover:text-blue-500 transition-colors"><Pencil /></button>
                                    <button onClick={() => remove(expense.id)} className="text-gray-400 hover:text-red-500 transition-colors"><Trash2 /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<FinanceTracker />, document.getElementById('root'));
    </script>
</body>
</html>
